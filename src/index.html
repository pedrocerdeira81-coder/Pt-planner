<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PT Planner">
<meta name="theme-color" content="#f4f0e8">
<title>PT Planner</title>
<link rel="apple-touch-icon" href="https://pedrocerdeira81-coder.github.io/Pt-planner/icons/planner-180.png">
<link rel="icon" href="https://pedrocerdeira81-coder.github.io/Pt-planner/icons/planner-180.png">
<style>
:root {
  --bg: #e7e2d8;
  --paper: #f7f4ee;
  --card: #fffcf8;
  --ink: #1c211e;
  --muted: #746d64;
  --line: #e4dcd0;
  --green: #0e6b4f;
  --green-soft: #e5f3ec;
  --amber: #8a5a00;
  --amber-soft: #fff4d8;
  --red: #8e2f2f;
  --red-soft: #fdecec;
  --blue: #1d4f86;
  --blue-soft: #e8f1fb;
  --shadow: 0 1px 1px rgba(50, 32, 10, 0.04), 0 10px 30px rgba(50, 32, 10, 0.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Avenir Next", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
  letter-spacing: -0.011em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app {
  width: 100%;
  max-width: 480px;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--paper);
  position: relative;
}
.example {
  background: #146c43;
  color: #f4fff8;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 8px 16px;
}
.top {
  padding: calc(16px + constant(safe-area-inset-top)) 18px 8px;
  padding: calc(16px + env(safe-area-inset-top)) 18px 8px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.brand {
  font-family: "Iowan Old Style", Palatino, ui-serif, Georgia, serif;
  font-size: 30px;
  line-height: 1;
  letter-spacing: -0.03em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.mark {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: var(--green);
  color: #f4fff8;
  font-family: "Avenir Next", -apple-system, sans-serif;
  font-size: 11px;
  font-weight: 750;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 0.04em;
}
.brand .mark { color: #f4fff8; }
.sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
.icon-btn, .back {
  border: 0;
  background: var(--card);
  width: 44px;
  height: 44px;
  border-radius: 14px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.back { width: auto; padding: 0 14px; font-weight: 650; font-size: 15px; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.wrap { padding: 8px 16px 108px; }
h2 {
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 18px 0 10px;
  font-weight: 750;
}
.card, .row, .client, .primary, .ghost, .danger {
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.card {
  background: var(--card);
  border-radius: 22px;
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 12px;
}
.sheet { animation: rise .28s ease; }
@keyframes rise { from { transform: translateY(18px); opacity: .5; } to { transform: none; opacity: 1; } }
.row {
  width: 100%;
  text-align: left;
  border: 0;
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 12px 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.when { width: 72px; flex: none; color: var(--muted); font-size: 13px; font-weight: 700; }
.when b { display: block; color: var(--ink); font-size: 15px; font-weight: 750; }
.grow { flex: 1; min-width: 0; }
.name { font-size: 16px; font-weight: 720; letter-spacing: -0.02em; }
.note { color: var(--muted); font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag, .pill {
  border-radius: 999px;
  padding: 4px 8px;
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.02em;
  flex: none;
}
.tag.normal, .pill.ok { background: var(--green-soft); color: var(--green); }
.tag.free { background: var(--blue-soft); color: var(--blue); }
.tag.booked { background: #e7eef5; color: #3d5a73; }
.tag.charged, .pill.low { background: var(--amber-soft); color: var(--amber); }
.pill.out { background: var(--red-soft); color: var(--red); }
.client {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 10px;
  border-left: 4px solid var(--green);
}
.client.low { border-left-color: #e0a100; }
.client.out { border-left-color: var(--red); }
.client-top, .spread { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.left { font-weight: 750; }
.left.low { color: var(--amber); }
.left.out { color: var(--red); }
.left.ok { color: var(--green); }
.bar { height: 6px; background: #efe8dc; border-radius: 99px; margin: 10px 0 8px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--green); border-radius: 99px; }
.client.low .bar span { background: #e0a100; }
.client.out .bar span { background: var(--red); }
.meta { color: var(--muted); font-size: 13px; }
.primary, .ghost, .danger {
  width: 100%;
  min-height: 48px;
  border-radius: 14px;
  border: 0;
  font-weight: 720;
  margin-top: 8px;
}
.primary { background: var(--green); color: white; }
.ghost { background: transparent; border: 1.5px solid var(--line); }
.danger { background: var(--red-soft); color: var(--red); }
.small { width: auto; min-height: 40px; padding: 0 14px; margin: 0; }
.nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  width: min(480px, 100%);
  bottom: 0;
  display: flex;
  background: rgba(255, 253, 251, 0.94);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding: 6px 6px calc(8px + constant(safe-area-inset-bottom));
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
  z-index: 5;
}
.nav button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 720;
  padding: 6px 0 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.nav button.on { color: var(--green); }
.hero-num {
  font-family: ui-serif, Georgia, serif;
  font-size: 64px;
  line-height: 0.9;
  letter-spacing: -0.04em;
}
.hero-num small { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; letter-spacing: 0; margin-left: 6px; font-weight: 650; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: #f6f3ee; border-radius: 14px; padding: 10px 12px; }
.stat b { display: block; font-size: 15px; }
.stat span { color: var(--muted); font-size: 11px; font-weight: 720; letter-spacing: 0.04em; text-transform: uppercase; }
label { display: block; font-size: 12px; font-weight: 720; color: var(--muted); margin: 12px 0 6px; }
input, select, textarea {
  width: 100%;
  min-height: 48px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: #fff;
  padding: 12px 14px;
  font-size: 16px;
}
textarea { min-height: 80px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font-weight: 720; }
.seg button.on { background: var(--ink); color: white; border-color: var(--ink); }
.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(28, 25, 22, 0.42);
  z-index: 20;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet {
  width: min(480px, 100%);
  background: #fffdfb;
  border-radius: 22px 22px 0 0;
  padding: 10px 16px calc(18px + env(safe-area-inset-bottom));
  max-height: 88dvh;
  overflow: auto;
}
.handle { width: 40px; height: 4px; border-radius: 99px; background: #e4ddd2; margin: 6px auto 12px; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 2px 8px; }
.day-head b { font-size: 16px; }
.today-mark { color: var(--green); }
.empty { color: var(--muted); text-align: center; padding: 32px 16px; line-height: 1.45; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.stats div { background: var(--card); border-radius: 18px; padding: 12px 10px; box-shadow: var(--shadow); }
.stats b { display: block; font-size: 15px; letter-spacing: -0.03em; margin-top: 4px; }
.stats span { color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: 0.06em; text-transform: uppercase; }
.row.is-free { opacity: 0.55; }
.row.is-free .name, .row.is-free .when b { color: var(--muted); font-weight: 650; }
.tier-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.tier-row input { min-height: 44px; }
.tier-row .ghost { width: auto; min-height: 44px; margin-top: 0; padding: 0 12px; }
button:disabled { opacity: .35; }
.banner {
  background: var(--green-soft);
  color: var(--green);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 10px;
  font-size: 14px;
  font-weight: 650;
}
.warn {
  background: var(--amber-soft);
  color: #6d4700;
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 10px;
  font-size: 14px;
}
.err { color: var(--red); font-size: 14px; font-weight: 650; margin-top: 8px; }
.weekbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.weekbar b { white-space: nowrap; }
.daybar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.daybar .ghost { width: auto; flex: 1 1 auto; min-height: 44px; margin-top: 0; padding: 0 10px; }
.daybar input[type="date"] { flex: 1 1 150px; min-width: 140px; min-height: 44px; }
.day.is-selected { outline: 2px solid var(--green); border-radius: 16px; padding: 4px; }
.when .meta { display: block; font-size: 11px; font-weight: 700; }
.check { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 15px; }
.check input { width: 22px; height: 22px; min-height: 0; }
.pair { display: flex; gap: 8px; }
.pair .ghost, .pair .primary, .pair .danger { margin-top: 0; }
ol.steps { margin: 8px 0 0; padding-left: 18px; }
ol.steps li { margin: 6px 0; }
a { color: var(--green); }
.loading, .fatal { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 32px; text-align: center; }
@media (min-width: 768px) {
  .app {
    max-width: 1100px;
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr);
    grid-template-rows: auto 1fr;
    align-items: start;
  }
  .app > .top { grid-column: 2; grid-row: 1; padding-bottom: 0; }
  .app > .wrap { grid-column: 2; grid-row: 2; padding: 8px 28px 40px; }
  .app > .nav {
    grid-column: 1;
    grid-row: 1 / span 2;
    position: sticky;
    top: 0;
    left: auto;
    transform: none;
    width: auto;
    height: 100dvh;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    gap: 4px;
    border-top: 0;
    border-right: 1px solid var(--line);
    background: #f3efe8;
    padding: 22px 12px 22px;
  }
  .nav button {
    flex: none;
    flex-direction: row;
    justify-content: flex-start;
    gap: 10px;
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 12px;
    text-align: left;
  }
  .nav button.on { background: var(--green-soft); }
  .stats { grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); }
  .home-split { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(280px, 0.95fr); gap: 22px; align-items: start; }
  .home-today { min-width: 0; }
  .client-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .client-grid > .client, .client-grid > .row, .client-grid > .card { margin-bottom: 0; }
  .week-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; align-items: start; }
  .week-grid .day-head { margin-top: 0; }
  .report-layout { display: grid; grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
  .detail { display: grid; grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
  .backdrop { align-items: center; padding: 24px; }
  .sheet { width: min(560px, 100%); border-radius: 22px; max-height: 86dvh; }
  .toolbar .primary { width: auto; min-width: 200px; padding-left: 22px; padding-right: 22px; }
}
@media (min-width: 1024px) {
  .client-grid { grid-template-columns: 1fr 1fr 1fr; }
  .week-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
</style>
</head>

<script>
(function () {
  var EXAMPLE = /(?:\?|&)example=1(?:&|$)/.test(location.search) && !(window.google && google.script && google.script.run);
  var state = null;
  var ui = { sheet: null, error: '', fatal: '', loading: false, monthOffset: 0, weekOffset: 0, boot: null };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function parseYmd(ymd) {
    var p = String(ymd || '').split('-');
    return new Date(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])));
  }
  function prettyDate(ymd) {
    var dt = parseYmd(ymd);
    if (isNaN(dt.getTime())) return '';
    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return days[dt.getUTCDay()] + ' ' + dt.getUTCDate() + ' ' + months[dt.getUTCMonth()];
  }
  function longDate(ymd) {
    var dt = parseYmd(ymd);
    if (isNaN(dt.getTime())) return '';
    var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    return days[dt.getUTCDay()] + ', ' + dt.getUTCDate() + ' ' + months[dt.getUTCMonth()];
  }
  function prettyTime(hm, allDay) {
    if (allDay || !hm) return 'All day';
    var h = Number(String(hm).slice(0, 2));
    var m = String(hm).slice(3, 5) || '00';
    var ap = h >= 12 ? 'pm' : 'am';
    var h12 = h % 12;
    if (!h12) h12 = 12;
    return h12 + ':' + m + ' ' + ap;
  }
  function money(n) {
    var v = Math.round(Number(n) || 0);
    var sign = v < 0 ? '-' : '';
    return 'AED ' + sign + Math.abs(v).toLocaleString('en-US');
  }
  function moneyExact(n) {
    var v = Math.round((Number(n) || 0) * 100) / 100;
    var sign = v < 0 ? '-' : '';
    return 'AED ' + sign + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function periodList() {
    return PT.sortPeriods((state.settings && state.settings.periods) || []);
  }
  function viewedPeriod() {
    var list = periodList(), i;
    if (ui.periodId) {
      for (i = 0; i < list.length; i++) if (String(list[i].id) === String(ui.periodId)) return list[i];
    }
    return PT.activePeriod(list, state.today);
  }
  function periodBar() {
    var list = periodList();
    var current = viewedPeriod();
    if (!current) {
      return '<div class="card"><div class="name">Set this pay period</div><p class="meta">J Club does not use calendar months. A period might run 30 Sep to 28 Oct, then 29 Oct to 29 Nov.</p><label>Starts</label><input data-field="pstart" type="date"><label>Ends</label><input data-field="pend" type="date"><button type="button" class="primary" data-act="save-period">Save period</button></div>';
    }
    var idx = 0, i;
    for (i = 0; i < list.length; i++) if (list[i].id === current.id) idx = i;
    var prev = idx > 0 ? list[idx - 1].id : '';
    var next = idx < list.length - 1 ? list[idx + 1].id : '';
    return '<div class="weekbar"><button type="button" class="ghost small" data-act="pick-period" data-id="' + esc(prev) + '"' + (prev ? '' : ' disabled') + '>Previous</button><b>' + esc(prettyDate(current.start) + ' – ' + prettyDate(current.end)) + '</b><button type="button" class="ghost small" data-act="pick-period" data-id="' + esc(next) + '"' + (next ? '' : ' disabled') + '>Next</button></div><div class="pair" style="margin-top:8px"><button type="button" class="ghost" data-act="edit-period" data-id="' + esc(current.id) + '">Edit these dates</button><button type="button" class="ghost" data-act="new-period">Next period</button></div>';
  }
  function route() {
    var h = (location.hash || '#home').replace(/^#/, '');
    var parts = h.split('/');
    return { name: parts[0] || 'home', id: decodeURIComponent(parts.slice(1).join('/')) };
  }
  function clientById(id) {
    var list = state.clients || [], i;
    for (i = 0; i < list.length; i++) if (String(list[i].id) === String(id)) return list[i];
    return null;
  }
  function sessionById(id) {
    var list = state.sessions || [], i;
    for (i = 0; i < list.length; i++) if (String(list[i].eventId) === String(id)) return list[i];
    return null;
  }
  function statusLabel(s) {
    if (s === 'free') return 'Free';
    if (s === 'charged') return 'Charged';
    return 'Normal';
  }
  function chargeLabel(t) {
    if (t === 'late_cancel') return 'Late cancel';
    if (t === 'no_show') return 'No show';
    return 'Other';
  }
  function icon(name) {
    var paths = {
      home: '<path d="M4 11 12 4l8 7v9a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/>',
      week: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3.5V7M16 3.5V7"/>',
      people: '<circle cx="9" cy="8" r="3"/><path d="M3.8 19c.5-2.8 2.6-4.2 5.2-4.2s4.7 1.4 5.2 4.2"/><circle cx="17" cy="9" r="2.2"/><path d="M16 14.6c1.8.4 3.2 1.5 3.8 3.6"/>',
      report: '<path d="M5 19V10M12 19V5M19 19v-7"/>',
      gear: '<path d="M4 8h16M4 16h16"/><circle cx="9" cy="8" r="2.3" fill="#fffdfb"/><circle cx="15" cy="16" r="2.3" fill="#fffdfb"/>'
    };
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (paths[name] || '') + '</svg>';
  }
  function field(name, root) {
    var el = (root || document).querySelector('[data-field="' + name + '"]');
    if (!el) return '';
    if (el.type === 'checkbox') return el.checked;
    return el.value;
  }

  function sessionEnded(s) {
    return PT.sessionHasEnded(s, viewClock());
  }
  function sessionButton(s, withDate) {
    var free = s.status === 'free';
    var ended = sessionEnded(s);
    var when = '<b>' + esc(prettyTime(s.start, s.allDay)) + '</b>';
    if (withDate) when = '<span class="meta">' + esc(prettyDate(s.date) || s.date || '') + '</span>' + when;
    var tag = ended ? statusLabel(s.status) : 'Booked';
    var tagClass = ended ? (s.status || 'normal') : 'booked';
    return '<button type="button" class="row' + (free ? ' is-free' : '') + (ended ? '' : ' is-booked') + '" data-act="session" data-id="' + esc(s.eventId) + '">' +
      '<div class="when">' + when + '</div>' +
      '<div class="grow"><div class="name">' + esc(s.clientName) + '</div>' +
      (s.note ? '<div class="note">' + esc(s.note) + '</div>' : '') +
      '</div><span class="tag ' + esc(tagClass) + '">' + tag + '</span></button>';
  }
  function clientButton(c) {
    var st = PT.currentRemaining(c, state.sessions, state.clients, viewClock());
    var klass = !st.ready ? 'ok' : (st.out ? 'out' : (st.low ? 'low' : 'ok'));
    var badge = !st.ready ? '<span class="pill low">Set</span>' : (st.out ? '<span class="pill out">Out</span>' : (st.low ? '<span class="pill low">Low</span>' : ''));
    var pct = st.total > 0 ? Math.max(0, Math.min(100, Math.round((st.used / st.total) * 100))) : (st.out ? 100 : 0);
    var period = viewedPeriod();
    var monthList = period ? PT.periodBillable([c], state.sessions, period, viewClock()) : [];
    var monthDone = monthList.filter(function (s) { return sessionEnded(s); }).length;
    var monthCount = monthList.length;
    return '<button type="button" class="client ' + klass + '" data-act="open-client" data-id="' + esc(c.id) + '">' +
      '<div class="client-top"><div class="name">' + esc(c.name) + '</div><div>' + badge + '</div></div>' +
      '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
      '<div class="spread"><span class="left ' + klass + '">' + (st.ready ? (st.remaining + ' left') : 'Set package') + '</span><span class="meta">' + (st.ready ? (st.used + ' of ' + st.total + ' used') : 'From the calendar') + '</span></div>' +
      '<div class="spread" style="margin-top:6px"><span class="meta">' + monthCount + ' this period' + (monthDone !== monthCount ? (' · ' + monthDone + ' finished') : '') + '</span><span class="meta">' + (st.ready ? esc(money(st.remainingValue)) + ' left' : 'Set package') + '</span></div></button>';
  }

  function shell(title, body, back) {
    var top = EXAMPLE ? '<div class="example">Example data. These are not real clients.</div>' : '';
    var head = '<header class="top"><div>' +
      (back ? '<button type="button" class="back" data-act="nav" data-go="' + esc(back) + '">Back</button>' : '<div class="brand"><span class="mark">PT</span> Planner</div><div class="sub">' + esc(title || '') + '</div>') +
      '</div>' +
      (back ? '' : '<button type="button" class="icon-btn" data-act="nav" data-go="#settings" aria-label="Settings">' + icon('gear') + '</button>') +
      '</header>';
    var notice = '';
    if (ui.boot && ui.boot.ok) {
      var n = (ui.boot.added || []).length;
      notice = '<div class="banner">' + (n ? ('Brought over ' + n + (n === 1 ? ' client.' : ' clients.')) : 'Those clients were already in PT Planner.') + '</div>';
    } else if (ui.boot && ui.boot.error) {
      notice = '<div class="warn">' + esc(ui.boot.error) + '</div>';
    }
    if (ui.syncing) notice += '<div class="banner">Syncing calendar…</div>';
    if (ui.syncError) notice += '<div class="warn">' + esc(ui.syncError) + ' Tap Update from Calendar to try again.</div>';
    if (!EXAMPLE && state && state.triggerError) notice += '<div class="warn">' + esc(state.triggerError) + '</div>';
    if (!EXAMPLE && state && state.triggerReady === false) notice += '<div class="warn">The 5:00 check is not on yet. Stay on this page. If Google asks, tap Allow.</div>';
    return top + '<div class="app" data-screen="' + esc(route().name) + '">' + head + '<div class="wrap">' + notice + body + '</div>' + nav() + sheet() + '</div>';
  }
  function nav() {
    var r = route().name;
    function item(id, label, ic) {
      return '<button type="button" data-act="nav" data-go="#' + id + '"' + (r === id ? ' class="on" aria-current="page"' : '') + '>' + icon(ic) + label + '</button>';
    }
    return '<nav class="nav">' + item('home', 'Home', 'home') + item('week', 'Week', 'week') + item('clients', 'Clients', 'people') + item('report', 'Report', 'report') + '</nav>';
  }
  function sheet() {
    if (!ui.sheet) return '';
    return '<div class="backdrop" data-act="close"><div class="sheet" data-act="stop"><div class="handle"></div>' + ui.sheet + '<div class="err" id="form-error">' + esc(ui.error || '') + '</div></div></div>';
  }

  function viewClock() {
    return { today: state.today || '', time: state.nowTime || '' };
  }
  function payFigures(period) {
    var clock = viewClock();
    var planned = period ? PT.periodBillable(state.clients, state.sessions, period, clock) : [];
    var done = period ? PT.periodFinished(state.clients, state.sessions, period, clock) : [];
    var projected = period ? PT.periodSessionRevenue(state.clients, state.sessions, period, clock) : 0;
    var earned = period ? PT.periodSessionRevenue(state.clients, done, period, clock) : 0;
    var chargeTotal = period ? PT.periodChargeTotal(state.charges, period, state.today) : 0;
    function estimate(revenue, count) {
      return PT.commissionEstimate({
        sessionRevenue: revenue,
        chargeTotal: chargeTotal,
        sessionCount: count,
        comm: state.settings
      });
    }
    return {
      billable: planned,
      done: done,
      earned: earned,
      projected: projected,
      chargeTotal: chargeTotal,
      est: estimate(earned, done.length),
      projectedEst: estimate(projected, planned.length)
    };
  }
  function payStats(pay) {
    var est = pay.est || {};
    var plan = pay.projectedEst || est;
    var off = state.settings && state.settings.showCommission === false;
    var doneN = (pay.done || []).length;
    var planN = (pay.billable || []).length;
    var booked = Math.max(0, planN - doneN);
    var tier = (est.tierPercent != null ? est.tierPercent : 0) + '%';
    var planTier = (plan.tierPercent != null ? plan.tierPercent : 0) + '%';
    var note = booked
      ? ('<p class="meta">' + doneN + ' finished · ' + booked + ' still booked in these dates. Earned commission ' + (off ? 'is off' : esc(moneyExact(est.commission))) + ' at ' + esc(tier) + '. If every booked session is done: ' + esc(planTier) + ', revenue ' + esc(moneyExact(pay.projected || 0)) + ', commission ' + (off ? 'off' : esc(moneyExact(plan.commission))) + '.</p>')
      : '<p class="meta">Every booking in these dates has already finished.</p>';
    return '<div class="stats"><div><span>In period</span><b>' + planN + '</b></div>' +
      '<div><span>Finished</span><b>' + doneN + '</b></div>' +
      '<div><span>Earned tier</span><b>' + esc(tier) + '</b></div>' +
      '<div><span>Earned</span><b>' + esc(moneyExact(pay.earned || 0)) + '</b></div>' +
      '<div><span>Earned comm.</span><b>' + (off ? 'Off' : esc(moneyExact(est.commission))) + '</b></div></div>' + note;
  }

  function homeScreen() {
    var today = state.today;
    var todays = (state.sessions || []).filter(function (s) {
      return s.date === today && s.disposition === 'kept';
    }).sort(PT.compareSessions);
    var attention = (state.clients || []).filter(function (c) {
      var st = PT.currentRemaining(c, state.sessions, state.clients, viewClock());
      return st.ready && (st.low || st.out);
    });
    var needs = (state.clients || []).filter(function (c) { return !PT.currentRemaining(c, state.sessions, state.clients, viewClock()).ready; });
    var period = viewedPeriod();
    var pay = payFigures(period);
    var lead = periodBar();
    lead += '<p class="sub" style="margin:12px 0">' + esc(state.lastSync ? ('Last check ' + state.lastSync) : 'Not checked yet') + (state.source && state.source.id ? (' · sheet ' + state.source.id) : '') + '</p>';
    lead += payStats(pay);
    lead += '<button type="button" class="primary" data-act="sync">Update from Calendar</button>';
    var todayFinished = todays.filter(function (s) { return s.status !== 'free' && sessionEnded(s); }).length;
    var todayBooked = todays.filter(function (s) { return s.status !== 'free' && !sessionEnded(s); }).length;
    var todayBlock = '<h2>Today <span class="meta">' + todayFinished + ' finished' + (todayBooked ? (' · ' + todayBooked + ' booked') : '') + '</span></h2>';
    if (!todays.length) todayBlock += '<div class="card empty">Nothing on the calendar today.</div>';
    todays.forEach(function (s) { todayBlock += sessionButton(s); });
    var body = '<div class="home-split"><div class="home-lead">' + lead + '</div><div class="home-today">' + todayBlock + '</div></div>';
    if (attention.length) {
      body += '<h2>Low or out</h2><div class="client-grid">';
      attention.forEach(function (c) { body += clientButton(c); });
      body += '</div>';
    }
    if (needs.length) {
      body += '<h2>Set a package</h2><div class="client-grid">';
      needs.forEach(function (c) { body += clientButton(c); });
      body += '</div>';
    }
    body += '<h2>Packages</h2>';
    var rest = (state.clients || []).slice().sort(function (a, b) {
      return PT.currentRemaining(a, state.sessions, state.clients, viewClock()).remaining - PT.currentRemaining(b, state.sessions, state.clients, viewClock()).remaining;
    });
    if (!rest.length) body += '<div class="card empty">Clients appear when a calendar title ends in PT.</div>';
    else {
      body += '<div class="client-grid">';
      rest.forEach(function (c) { body += clientButton(c); });
      body += '</div>';
    }
    return shell(longDate(today), body, '');
  }

  function selectedDay() {
    var day = ui.day || state.today;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(day || ''))) day = state.today;
    return day;
  }
  function weekScreen() {
    var focus = selectedDay();
    var start = PT.mondayOf(focus);
    var end = PT.addDaysYmd(start, 6);
    var body = '<div class="daybar"><button type="button" class="ghost" data-act="day" data-id="-1">Previous day</button>' +
      '<input data-field="browse-day" type="date" aria-label="Choose a day" value="' + esc(focus) + '">' +
      '<button type="button" class="ghost" data-act="day" data-id="today">Today</button>' +
      '<button type="button" class="ghost" data-act="day" data-id="1">Next day</button></div>' +
      '<div class="weekbar"><button type="button" class="ghost small" data-act="day" data-id="-7">Previous week</button><b>' + esc(prettyDate(start) + ' – ' + prettyDate(end)) + '</b><button type="button" class="ghost small" data-act="day" data-id="7">Next week</button></div>' +
      '<p class="meta">A day number is bookings already saved. Booked means it has not finished yet. Finished totals are on Home and Report.</p><div class="week-grid">';
    var d, i, list, label;
    for (i = 0; i < 7; i++) {
      d = PT.addDaysYmd(start, i);
      list = (state.sessions || []).filter(function (s) { return s.date === d && s.disposition === 'kept'; }).sort(PT.compareSessions);
      label = prettyDate(d) + (d === state.today ? ' · Today' : '');
      var finished = list.filter(function (s) { return s.status !== 'free' && sessionEnded(s); }).length;
      var booked = list.filter(function (s) { return s.status !== 'free' && !sessionEnded(s); }).length;
      body += '<section class="day' + (d === focus ? ' is-selected' : '') + '"><div class="day-head"><b class="' + (d === state.today ? 'today-mark' : '') + '">' + esc(label) + '</b><span class="meta">' + finished + (booked ? (' + ' + booked + ' booked') : '') + '</span></div>';
      if (!list.length) body += '<div class="meta" style="margin:0 2px 8px">Nothing saved</div>';
      list.forEach(function (s) { body += sessionButton(s); });
      body += '</section>';
    }
    body += '</div>';
    return shell('Week', body, '');
  }

  function clientsScreen() {
    var body = '<div class="toolbar"><button type="button" class="primary" data-act="new-client">Add a client</button></div>';
    var list = (state.clients || []).slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    if (!list.length) body += '<div class="card empty">No clients yet.</div>';
    else {
      body += '<div class="client-grid">';
      list.forEach(function (c) { body += clientButton(c); });
      body += '</div>';
    }
    return shell('Clients', body, '');
  }

  function clientScreen(id) {
    var c = clientById(id);
    if (!c) return shell('Client', '<div class="card empty">That client is not here.</div>', '#clients');
    var st = PT.currentRemaining(c, state.sessions, state.clients, viewClock());
    var klass = st.out ? 'out' : (st.low ? 'low' : 'ok');
    var body = '<div class="detail"><div class="detail-side"><div class="card"><div class="name" style="font-size:22px">' + esc(c.name) + '</div>' +
      '<div class="hero-num ' + klass + '" style="margin-top:10px;color:' + (!st.ready ? 'var(--ink)' : st.out ? 'var(--red)' : st.low ? 'var(--amber)' : 'var(--green)') + '">' + (st.ready ? (st.remaining + '<small>left</small>') : '<small style="font-size:28px">Set the package</small>') + '</div>' +
      '<p class="meta" style="margin-top:8px">' + (st.ready ? (st.used + ' of ' + st.total + ' used · ' + moneyExact(st.perSession) + ' each') : 'Add the package size, what is left, and the price.') + '</p>' +
      (st.ready && (st.used + st.remaining) !== st.total ? '<p class="meta">Used ' + st.used + ' plus left ' + st.remaining + ' is ' + (st.used + st.remaining) + '. The package size is ' + st.total + '. They differ because sessions left was typed in, and that typed number is kept.</p>' : '') +
      '<p class="meta">Only sessions that have already finished, on or after the start date, are used. Later bookings stay on the list.</p>' +
      '<div class="grid" style="margin-top:12px"><div class="stat"><b>' + esc(money(st.value)) + '</b><span>Package</span></div><div class="stat"><b>' + (st.ready ? esc(moneyExact(st.remainingValue)) : '—') + '</b><span>Value left</span></div></div>' +
      '<p class="meta">Counts from ' + esc(st.startDate ? prettyDate(st.startDate) : 'the start date') + (st.note ? ' · ' + esc(st.note) : '') + '</p>' +
      '<div class="pair" style="margin-top:8px"><button type="button" class="primary" data-act="renew" data-id="' + esc(c.id) + '">Renew</button><button type="button" class="ghost" data-act="fix" data-id="' + esc(c.id) + '">Fix numbers</button></div></div></div><div class="detail-main">';
    var packages = PT.sortPackages(c.packages || []);
    if (packages.length > 1) {
      body += '<h2>History</h2>';
      packages.forEach(function (pkg) {
        var used = PT.packageUsed(c, state.sessions, pkg, state.clients, viewClock());
        var current = PT.currentPackage(c.packages);
        body += '<div class="card"><b>' + (current && current.id === pkg.id ? 'Current package' : 'Earlier package') + '</b><div class="meta" style="margin-top:4px">' + used + ' of ' + esc(pkg.sessions) + ' used · ' + esc(money(pkg.value)) + (pkg.startDate ? ' · from ' + esc(prettyDate(pkg.startDate)) : '') + '</div></div>';
      });
    }
    if ((c.aliases || []).length) body += '<h2>Calendar names</h2><div class="card">' + c.aliases.map(function (a) { return esc(a); }).join(', ') + '</div>';
    var sessions = PT.sessionsForClient(c, state.sessions, state.clients).slice().reverse();
    body += '<h2>Sessions</h2>';
    if (!sessions.length) body += '<div class="card empty">No kept sessions yet.</div>';
    var lastDay = '';
    sessions.slice(0, 40).forEach(function (s) {
      if (s.date !== lastDay) {
        body += '<div class="day-head"><b>' + esc(prettyDate(s.date) || s.date) + (s.date === state.today ? ' · Today' : '') + '</b></div>';
        lastDay = s.date;
      }
      body += sessionButton(s);
    });
    var charges = (state.charges || []).filter(function (ch) { return String(ch.clientId) === String(c.id); });
    body += '<h2>Charges</h2>';
    if (!charges.length) body += '<div class="card empty">No AED charges.</div>';
    charges.forEach(function (ch) { body += chargeRow(ch); });
    body += '<button type="button" class="ghost" data-act="add-charge" data-id="' + esc(c.id) + '">Add an AED charge</button>';
    body += '<button type="button" class="danger" data-act="ask-delete" data-id="' + esc(c.id) + '">Remove client</button>';
    body += '</div></div>';
    return shell('', body, '#clients');
  }

  function chargeRow(ch) {
    var c = clientById(ch.clientId);
    return '<div class="card"><div class="spread"><b>' + esc(c ? c.name : 'Client') + '</b><b>' + esc(money(ch.amount)) + '</b></div>' +
      '<div class="meta" style="margin-top:4px">' + esc(chargeLabel(ch.type)) + ' · ' + esc(prettyDate(ch.date)) + '</div>' +
      (ch.notes ? '<div class="note">' + esc(ch.notes) + '</div>' : '') +
      '<div class="pair" style="margin-top:8px"><button type="button" class="ghost small" data-act="edit-charge" data-id="' + esc(ch.id) + '">Edit</button><button type="button" class="ghost small" data-act="delete-charge" data-id="' + esc(ch.id) + '">Remove</button></div></div>';
  }

  function reportScreen() {
    var period = viewedPeriod();
    var pay = payFigures(period);
    var body = periodBar();
    if (!period) return shell('Report', body + '<div class="card empty">Set the pay period and the report will use those dates.</div>', '');
    body += '<div class="report-layout"><div class="report-summary"><div class="card" style="margin-top:12px"><div class="meta">Sessions in these dates</div><div class="hero-num" style="font-size:48px;margin-top:6px">' + pay.billable.length + '</div>' +
      '<p class="meta">' + (pay.done || []).length + ' finished · ' + Math.max(0, pay.billable.length - (pay.done || []).length) + ' still booked. Free sessions are not counted. Keep the real gym dates. A shorter end date is only if you want a smaller range.</p>' +
      payStats(pay) +
      '<p class="meta">Net ' + esc(moneyExact(pay.est.netRevenue)) + ' after ' + esc(String(Math.round(pay.est.netFactor * 100) / 100)) + '%. Quota ' + esc(moneyExact(pay.est.quota)) + ' comes off. Commission revenue ' + esc(moneyExact(pay.est.commRevenue)) + '. Charges ' + esc(money(pay.chargeTotal)) + (pay.est.includeCharges ? ' are in the commission.' : ' stay out of the commission.') + '</p></div>';
    body += '</div><div class="report-people">';
    var rows = (state.clients || []).map(function (c) {
      var list = PT.sessionsForClient(c, state.sessions, state.clients).filter(function (s) {
        return PT.inPeriod(s.date, period, state.today);
      });

      var finished = list.filter(function (s) { return s.status !== 'free' && sessionEnded(s); }).length;
      var booked = counted - finished;

      return { name: c.name, counted: counted, finished: finished, booked: booked, free: free };
    }).filter(function (r) { return r.counted || r.booked || r.free; }).sort(function (a, b) { return b.counted - a.counted; });
    body += '<h2>By client</h2>';
    if (!rows.length) body += '<div class="card empty">No sessions in these dates.</div>';
    else {
      body += '<div class="client-grid">';
      rows.forEach(function (r) {
        body += '<div class="card"><div class="spread"><b>' + esc(r.name) + '</b><b>' + r.counted + '</b></div>' +
          '<div class="meta">' + r.finished + ' finished' + (r.booked ? (' · ' + r.booked + ' booked') : '') + '</div>' +
          (r.free ? '<div class="meta">' + r.free + ' free, not counted</div>' : '') + '</div>';
      });
      body += '</div>';
    }
    body += '<button type="button" class="ghost" data-act="nav" data-go="#charges">Charges in AED</button></div></div>';
    return shell('Report', body, '');
  }

  function balancesScreen() {
    var review = PT.legacyBalanceReview(state.clients, state.sessions, viewClock(), (state.settings && state.settings.periods) || []);
    var body = '<p class="meta">Calendar window used for this check: ' + esc(prettyDate(review.windowStart) || review.windowStart) + ' to ' + esc(prettyDate(review.windowEnd) || review.windowEnd) + '. Apply only switches the ticked rows to size minus finished sessions. Nothing is deleted.</p>';
    var any = false;
    review.rows.forEach(function (row) {
      if (row.status === 'auto') return;

      var box = row.selected ? ' checked' : '';
      var can = row.status === 'legacy';
      body += '<div class="card"><div class="spread"><b>' + esc(row.name) + '</b><span>' + (can ? '<label class="check"><input type="checkbox" data-balance-id="' + esc(row.clientId) + '"' + box + '> Apply</label>' : esc(row.status === 'explicit' ? 'Kept' : row.status === 'kept-zero' ? 'Zero kept' : row.status === 'short-history' ? 'Needs history' : 'Skipped')) + '</span></div>' +
        '<p class="meta">Now ' + row.oldLeft + ' left. Calendar ' + row.calendarLeft + ' left (' + row.size + ' minus ' + row.calendarUsed + ' finished).</p>' +

  }

  function chargesScreen() {
    var period = viewedPeriod();

    body += '<div class="card" style="margin-top:12px"><div class="meta">Charges this period</div><div class="hero-num" style="font-size:42px;margin-top:6px">' + esc(money(total)) + '</div></div>';

      body += '</div>';

  function tierRows(tiers) {
    var list = (tiers && tiers.length) ? tiers : PT.defaultTiers();
    return list.map(function (row, i) {
      return '<div class="tier-row"><input data-field="tier-from" inputmode="numeric" aria-label="From sessions" value="' + esc(row.from) + '">' +
        '<input data-field="tier-rate" inputmode="decimal" aria-label="Rate percent" value="' + esc(row.rate) + '">' +

  function readTierInputs(root) {

  }
  function settingsScreen() {
    var s = state.settings || {};
    var net = (s.netFactor != null && s.netFactor !== '') ? s.netFactor : PT.normalizeComm({}).netFactor;
    var quota = (s.quota != null && s.quota !== '') ? s.quota : '7758';
    var src = state.source || {};
    var body = '<div class="name" style="font-size:28px;font-family:ui-serif,Georgia,serif;margin-bottom:8px">Settings</div>';
    if (src.id || src.code) {
      body += '<div class="card"><b>Where this copy saves</b><p class="meta">This screen reads one Google Sheet, the one bound to the script you opened. A different file named PT Planner is not this copy.</p>' +
        '<p class="meta">Spreadsheet id ' + esc(src.id || 'unknown') + (src.name ? (' · ' + esc(src.name)) : '') + '</p>' +
        (src.url ? '<p class="meta"><a href="' + esc(src.url) + '">Open that spreadsheet</a></p>' : '') +
        '<p class="meta">Code ' + esc(src.code || '') + '</p></div>';
    }

  function localAct(name, args) {
    var a = args[0] || {};
    if (name === 'apiSyncNow') {
      state.lastSync = state.today + ' 05:04 Asia/Dubai';
      ui.toast = 'Example calendar is already loaded.';
      return;
    }
    if (name === 'apiEmailSummary') {
      ui.toast = 'Example only. No email was sent.';
      return;
    }
    if (name === 'apiSetStatus') state.sessions = PT.setStatus(state.sessions, a.eventId, a.status);
    else if (name === 'apiHide') state.sessions = PT.hideSession(state.sessions, a.eventId).filter(function (s) { return !s.hidden; });
    else if (name === 'apiMap') {
      if (a.action === 'ignore') {
        var ig = PT.ignoreName(state.ignored, state.sessions, a.name);
        state.ignored = ig.ignored;
        state.sessions = ig.sessions.filter(function (s) { return s.disposition !== 'ignored'; });
      } else if (a.action === 'create') {
        state.clients = PT.createClient(state.clients, a, state.sessions, state.clients, viewClock());
        var created = state.clients[state.clients.length - 1];
        var made = PT.linkName(state.clients, state.sessions, created.id, a.name);
        state.clients = made.clients;
        state.sessions = made.sessions;
      } else {
        var linked = PT.linkName(state.clients, state.sessions, a.clientId, a.name);
        state.clients = linked.clients;
        state.sessions = linked.sessions;
      }
    } else if (name === 'apiSaveClient') {
      if (!a.id) state.clients = PT.createClient(state.clients, a, state.sessions, state.clients, viewClock());
      else {
        state.clients = state.clients.map(function (c) {
          return String(c.id) === String(a.id) ? PT.saveClientPackage(c, a, state.sessions, state.clients, viewClock()) : c;
        });
      }
    } else if (name === 'apiSavePeriods') {
      var savedPeriods = PT.savePeriods((state.settings && state.settings.periods) || [], a);
      state.settings.periods = savedPeriods.periods;
      ui.periodId = savedPeriods.id;
    } else if (name === 'apiDeleteClient') {
      var removed = PT.deleteClient(state.clients, state.sessions, a.id);
      state.clients = removed.clients;
      state.sessions = removed.sessions.filter(function (s) { return s.disposition !== 'ignored'; });
      state.charges = (state.charges || []).filter(function (ch) { return String(ch.clientId) !== String(a.id); });
      if (route().name === 'client') location.hash = '#clients';
    } else if (name === 'apiSaveCharge') {
      var amount = Number(a.amount);
      if (!isFinite(amount) || amount < 0) throw new Error('Enter an amount in AED, or 0.');
      if (!a.clientId) throw new Error('Choose a client.');
      var entry = PT.migrateCharge({
        id: a.id || ('ch' + Date.now()),
        clientId: a.clientId,
        eventId: a.eventId || '',
        type: a.type || 'other',
        amount: amount,
        date: a.date || state.today,
        notes: a.notes || '',
        createdAt: state.today
      });
      var replaced = false;
      state.charges = (state.charges || []).map(function (ch) {
        if (a.id && String(ch.id) === String(a.id)) { replaced = true; return entry; }
        return ch;
      });
      if (!replaced) state.charges = state.charges.concat([entry]);
    } else if (name === 'apiDeleteCharge') {
      state.charges = (state.charges || []).filter(function (ch) { return String(ch.id) !== String(a.id); });
    } else if (name === 'apiApplyBalances') {
      var applied = PT.applyLegacyBalances(state.clients, a.ids || [], state.sessions, viewClock(), (state.settings && state.settings.periods) || []);
      state.clients = applied.clients;
    } else if (name === 'apiSaveSettings') {
      var comm = PT.normalizeComm(a);
      comm.periods = (state.settings && state.settings.periods) || [];
      state.settings = comm;
    } else if (name === 'apiUnignore') {
      var key = PT.normName(a.name);
      state.ignored = (state.ignored || []).filter(function (n) { return PT.normName(n) !== key; });
    }
  }

  function call(name, args, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var limit = window.PT_CALL_TIMEOUT || timeoutMs || 20000;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        reject(new Error('This is taking too long. Check the connection, then tap Try again.'));
      }, limit);
      function finish(fn, value) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        fn(value);
      }
      try {
        if (!(window.google && google.script && google.script.run)) {
          finish(reject, new Error('Open PT Planner from the Google link, in Safari.'));
          return;
        }
        // google.script.run ignores Function.apply and Function.call, and then
        // neither handler runs. Call the server function directly.
        var runner = google.script.run
          .withSuccessHandler(function (value) { finish(resolve, value); })
          .withFailureHandler(function (err) {
            var message = 'Could not reach PT Planner.';
            if (err && err.message) message = String(err.message);
            else if (typeof err === 'string' && err) message = err;
            finish(reject, new Error(message));
          });
        args = args || [];
        if (args.length === 0) runner[name]();
        else if (args.length === 1) runner[name](args[0]);
        else if (args.length === 2) runner[name](args[0], args[1]);
        else if (args.length === 3) runner[name](args[0], args[1], args[2]);
        else finish(reject, new Error('PT Planner could not send that request.'));
      } catch (err) {
        finish(reject, new Error((err && err.message) || 'PT Planner could not start.'));
      }
    });
  }

  function go(name, args) {
    try {
      if (EXAMPLE) {
        localAct(name, args || [{}]);
        ui.error = '';
        ui.sheet = null;
        render();
        if (ui.toast) {
          var note = ui.toast;
          ui.toast = '';
          var el = document.createElement('div');
          el.className = 'banner';
          el.style.position = 'fixed';
          el.style.left = '16px';
          el.style.right = '16px';
          el.style.bottom = '96px';
          el.style.zIndex = '30';
          el.textContent = note;
          document.body.appendChild(el);
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2200);
        }
        return;
      }
      ui.loading = true;
      var slow = name === 'apiSyncNow' || name === 'apiEmailSummary';
      call(name, args, slow ? 120000 : 20000).then(afterSave).catch(function (err) { ui.loading = false; showError(err.message); });
    } catch (err) {
      showError(err.message);
    }
  }

  function onClick(e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'stop') return;
    if (act === 'close') { ui.sheet = null; ui.error = ''; render(); return; }
    if (act === 'nav') {
      ui.sheet = null;
      var dest = el.getAttribute('data-go');
      if (location.hash !== dest) location.hash = dest;
      else render();
      return;
    }
    if (act === 'week' || act === 'day') {
      var step = el.getAttribute('data-id');
      if (step === 'today') ui.day = state.today;
      else ui.day = PT.addDaysYmd(selectedDay(), Number(step || 0));
      render();
      return;
    }
    if (act === 'pick-period') {
      var pick = el.getAttribute('data-id');
      if (!pick) return;
      ui.periodId = pick;
      render();
      return;
    }
    if (act === 'edit-period' || act === 'new-period') {
      var chosen = null;
      if (act === 'edit-period') {
        periodList().forEach(function (p) { if (String(p.id) === String(el.getAttribute('data-id'))) chosen = p; });
      }
      ui.error = '';
      ui.sheet = '<div class="name">' + (act === 'new-period' ? 'Next pay period' : 'Edit pay period') + '</div><p class="meta">Use the exact dates from J Club. Totals update as soon as you save.</p><label>Starts</label><input data-field="pstart" type="date" value="' + esc(chosen ? chosen.start : '') + '"><label>Ends</label><input data-field="pend" type="date" value="' + esc(chosen ? chosen.end : '') + '"><button type="button" class="primary" data-act="save-period" data-id="' + esc(chosen ? chosen.id : '') + '">Save</button>';
      render();
      return;
    }
    if (act === 'save-period') {
      var holder = el.closest('.sheet') || el.closest('.card') || document;
      go('apiSavePeriods', [{ id: el.getAttribute('data-id') || '', start: field('pstart', holder), end: field('pend', holder) }]);
      return;
    }
    if (act === 'session') { openSession(el.getAttribute('data-id')); return; }
    if (act === 'open-client') { location.hash = '#client/' + encodeURIComponent(el.getAttribute('data-id')); return; }
    if (act === 'sync') {
      if (EXAMPLE) { go('apiSyncNow', [{}]); return; }
      beginSync();
      return;
    }
    if (act === 'email') { go('apiEmailSummary', [{}]); return; }
    if (act === 'status') { go('apiSetStatus', [{ eventId: el.getAttribute('data-id'), status: el.getAttribute('data-status') }]); return; }
    if (act === 'hide') { go('apiHide', [{ eventId: el.getAttribute('data-id') }]); return; }
    if (act === 'new-client') { openClientForm(null); return; }
    if (act === 'fix') { openClientForm(clientById(el.getAttribute('data-id'))); return; }
    if (act === 'renew') { openRenew(el.getAttribute('data-id')); return; }
    if (act === 'save-client' || act === 'save-renew') {
      var root = el.closest('.sheet');
      var pack = readPackage(root);
      pack.id = el.getAttribute('data-id');
      pack.mode = act === 'save-renew' ? 'renew' : 'edit';
      go('apiSaveClient', [pack]);
      return;
    }
    if (act === 'ask-delete') { openDelete(el.getAttribute('data-id')); return; }
    if (act === 'delete-client') { go('apiDeleteClient', [{ id: el.getAttribute('data-id') }]); return; }
    if (act === 'add-charge') { ui.sheet = null; openCharge(el.getAttribute('data-id'), el.getAttribute('data-event'), el.getAttribute('data-date')); return; }
    if (act === 'edit-charge') {
      var existing = null;
      (state.charges || []).forEach(function (ch) { if (String(ch.id) === String(el.getAttribute('data-id'))) existing = ch; });
      if (!existing) return;
      openCharge(existing.clientId, existing.eventId, existing.date, existing);
      return;
    }
    if (act === 'save-charge') {
      var box = el.closest('.sheet');
      go('apiSaveCharge', [{
        id: el.getAttribute('data-id') || '',
        clientId: field('clientId', box),
        amount: field('amount', box),
        type: field('type', box) || 'other',
        date: field('date', box),
        notes: field('notes', box),
        eventId: el.getAttribute('data-event') || ''
      }]);
      return;
    }
    if (act === 'delete-charge') { go('apiDeleteCharge', [{ id: el.getAttribute('data-id') }]); return; }
    if (act === 'add-tier' || act === 'remove-tier') {
      var edited = readTierInputs(el.closest('.sheet') || document);
      if (act === 'add-tier') edited.push({ from: '', rate: '' });
      else edited.splice(Number(el.getAttribute('data-id')), 1);
      state.settings = state.settings || {};
      state.settings.tiers = edited;
      render();
      return;
    }
    if (act === 'save-settings') {
      go('apiSaveSettings', [{
        showCommission: field('showCommission'),
        includeCharges: field('includeCharges'),
        quota: field('quota'),
        netFactor: field('netFactor'),
        tiers: readTierInputs(document)
      }]);
      return;
    }
    if (act === 'apply-balances') {
      var picked = [];
      document.querySelectorAll('[data-balance-id]').forEach(function (box) {
        if (box.checked) picked.push(box.getAttribute('data-balance-id'));
      });
      go('apiApplyBalances', [{ ids: picked }]);
      return;
    }
    if (act === 'unignore') { go('apiUnignore', [{ name: el.getAttribute('data-name') }]); return; }
    if (act === 'retry-boot') { startApp(); return; }
  }

  function render() {
    var root = document.getElementById('app');

      var splash = '<div class="app loading"><div><div class="brand"><span class="mark">PT</span> Planner</div>';
      if (ui.fatal) {
        splash += '<p>' + esc(ui.fatal) + '</p><button type="button" class="primary" data-act="retry-boot">Try again</button>';
      } else {
        splash += '<p class="meta">' + esc(ui.status || 'Opening your planner…') + '</p>';
      }
      root.innerHTML = splash + '</div></div>';
      return;
    }
    var r = route();
    var html = '';
    if (r.name === 'week') html = weekScreen();
    else if (r.name === 'clients') html = clientsScreen();
    else if (r.name === 'client') html = clientScreen(r.id);
    else if (r.name === 'report') html = reportScreen();
    else if (r.name === 'charges') html = chargesScreen();
    else if (r.name === 'settings') html = settingsScreen();
    else if (r.name === 'balances') html = balancesScreen();
    else html = homeScreen();
    root.innerHTML = html;
  }

  function readBoot() {

    var text = (el.textContent || '').replace(/^\s+|\s+$/g, '');
    if (!text || text === '___PT_BOOT___' || text === 'null') return null;
    try { return JSON.parse(text); } catch (e) { return null; }
  }

  function buildExample() {
    function many(name, dates, start, status, note) {
      return dates.map(function (date, i) {

          eventId: name.toLowerCase().replace(/\s+/g, '-') + '-' + date,
          calendarId: 'example',

          end: '08:00',

          statusLocked: !!(status && status !== 'normal'),

          hidden: false,
          removed: false,
          createdAt: '2026-10-01 05:04'
        };
      });
    }
    var clients = [
      PT.migrateClient({ id: 'larissa', name: 'Larissa', packageSessions: '20', packageValue: '7000', startDate: '2026-09-01' }),
      PT.migrateClient({ id: 'jeremy', name: 'Jeremy', packageSessions: '12', packageValue: '4800', startDate: '2026-08-01' }),
      PT.migrateClient({
        id: 'mohammad',

          { id: 'm-old', sessions: '8', value: '4000', startDate: '2026-01-06' },

        ]
      }),
      PT.migrateClient({ id: 'sofia', name: 'Sofia', packageSessions: '16', packageValue: '6400', startDate: '2026-10-01' }),
      PT.migrateClient({ id: 'omar', name: 'Omar', packageSessions: '', packageValue: '', startDate: '2026-11-02' })

  function pollSync(seen, n) {
    if (n > 20) {
      ui.syncing = false;
      render();
      return;
    }
    setTimeout(function () {
      call('apiGetState', [], 15000).then(function (s) {
        if (s && s.today) state = s;
        if (s && s.lastSync && s.lastSync !== seen) {
          ui.syncing = false;
          render();
          return;
        }
        render();
        pollSync(seen, n + 1);
      }).catch(function () { pollSync(seen, n + 1); });
    }, 4000);
  }
  function beginSync() {
    if (!state) return;
    var seen = state.lastSync || '';
    ui.syncing = true;
    ui.syncError = '';
    render();
    var attempt = 0;
    function run() {
      attempt++;
      call('apiSyncNow', [], 90000).then(function (next) {
        if (next && next.syncing) {
          pollSync(seen, 0);
          return;
        }
        if (next && next.today) state = next;
        ui.syncing = false;
        render();
      }).catch(function (err) {
        if (attempt < 3) {
          setTimeout(run, 4000);
          return;
        }
        ui.syncing = false;
        ui.syncError = (err && err.message) || 'Calendar check did not finish.';
        render();
      });
    }
    run();
