<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>PT Planner</title>

<style>
:root {
  --bg: #e7e2d8;
  --paper: #f7f4ee;
  --card: #fffcf8;
  --ink: #1c211e;
  --muted: #746d64;
  --line: #e4dcd0;
  --green: #0e6b4f;
  --green-soft: #e5f3ec;
  --amber: #8a5a00;
  --amber-soft: #fff4d8;
  --red: #8e2f2f;
  --red-soft: #fdecec;
  --blue: #1d4f86;
  --blue-soft: #e8f1fb;
  --shadow: 0 1px 1px rgba(50, 32, 10, 0.04), 0 10px 30px rgba(50, 32, 10, 0.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Avenir Next", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
  letter-spacing: -0.011em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app {
  max-width: 480px;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--paper);
  position: relative;
}
.example {
  background: #146c43;
  color: #f4fff8;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 8px 16px;
}
.top {
  padding: calc(16px + constant(safe-area-inset-top)) 18px 8px;
  padding: calc(16px + env(safe-area-inset-top)) 18px 8px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.brand {
  font-family: "Iowan Old Style", Palatino, ui-serif, Georgia, serif;
  font-size: 30px;
  line-height: 1;
  letter-spacing: -0.03em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.mark {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: var(--green);
  color: #f4fff8;
  font-family: "Avenir Next", -apple-system, sans-serif;
  font-size: 11px;
  font-weight: 750;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 0.04em;
}
.brand span { color: var(--green); }
.sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
.icon-btn, .back {
  border: 0;
  background: var(--card);
  width: 44px;
  height: 44px;
  border-radius: 14px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.back { width: auto; padding: 0 14px; font-weight: 650; font-size: 15px; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.wrap { padding: 8px 16px 108px; }
h2 {
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 18px 0 10px;
  font-weight: 750;
}
.card, .row, .client, .primary, .ghost, .danger {
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.card {
  background: var(--card);
  border-radius: 22px;
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 12px;
}
.sheet { animation: rise .28s ease; }
@keyframes rise { from { transform: translateY(18px); opacity: .5; } to { transform: none; opacity: 1; } }
.row {
  width: 100%;
  text-align: left;
  border: 0;
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 12px 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.when { width: 72px; flex: none; color: var(--muted); font-size: 13px; font-weight: 700; }
.when b { display: block; color: var(--ink); font-size: 15px; font-weight: 750; }
.grow { flex: 1; min-width: 0; }
.name { font-size: 16px; font-weight: 720; letter-spacing: -0.02em; }
.note { color: var(--muted); font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag, .pill {
  border-radius: 999px;
  padding: 4px 8px;
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.02em;
  flex: none;
}
.tag.normal, .pill.ok { background: var(--green-soft); color: var(--green); }
.tag.free { background: var(--blue-soft); color: var(--blue); }
.tag.charged, .pill.low { background: var(--amber-soft); color: var(--amber); }
.pill.out { background: var(--red-soft); color: var(--red); }
.client {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 10px;
  border-left: 4px solid var(--green);
}
.client.low { border-left-color: #e0a100; }
.client.out { border-left-color: var(--red); }
.client-top, .spread { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.left { font-weight: 750; }
.left.low { color: var(--amber); }
.left.out { color: var(--red); }
.left.ok { color: var(--green); }
.bar { height: 6px; background: #efe8dc; border-radius: 99px; margin: 10px 0 8px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--green); border-radius: 99px; }
.client.low .bar span { background: #e0a100; }
.client.out .bar span { background: var(--red); }
.meta { color: var(--muted); font-size: 13px; }
.primary, .ghost, .danger {
  width: 100%;
  min-height: 48px;
  border-radius: 14px;
  border: 0;
  font-weight: 720;
  margin-top: 8px;
}
.primary { background: var(--green); color: white; }
.ghost { background: transparent; border: 1.5px solid var(--line); }
.danger { background: var(--red-soft); color: var(--red); }
.small { width: auto; min-height: 40px; padding: 0 14px; margin: 0; }
.nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  width: min(480px, 100%);
  bottom: 0;
  display: flex;
  background: rgba(255, 253, 251, 0.94);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding: 6px 6px calc(8px + constant(safe-area-inset-bottom));
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
  z-index: 5;
}
.nav button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 720;
  padding: 6px 0 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.nav button.on { color: var(--green); }
.hero-num {
  font-family: ui-serif, Georgia, serif;
  font-size: 64px;
  line-height: 0.9;
  letter-spacing: -0.04em;
}
.hero-num small { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; letter-spacing: 0; margin-left: 6px; font-weight: 650; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: #f6f3ee; border-radius: 14px; padding: 10px 12px; }
.stat b { display: block; font-size: 15px; }
.stat span { color: var(--muted); font-size: 11px; font-weight: 720; letter-spacing: 0.04em; text-transform: uppercase; }
label { display: block; font-size: 12px; font-weight: 720; color: var(--muted); margin: 12px 0 6px; }
input, select, textarea {
  width: 100%;
  min-height: 48px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: #fff;
  padding: 12px 14px;
  font-size: 16px;
}
textarea { min-height: 80px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font-weight: 720; }
.seg button.on { background: var(--ink); color: white; border-color: var(--ink); }
.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(28, 25, 22, 0.42);
  z-index: 20;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet {
  width: min(480px, 100%);
  background: #fffdfb;
  border-radius: 22px 22px 0 0;
  padding: 10px 16px calc(18px + env(safe-area-inset-bottom));
  max-height: 88dvh;
  overflow: auto;
}
.handle { width: 40px; height: 4px; border-radius: 99px; background: #e4ddd2; margin: 6px auto 12px; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 2px 8px; }
.day-head b { font-size: 16px; }
.today-mark { color: var(--green); }
.empty { color: var(--muted); text-align: center; padding: 32px 16px; line-height: 1.45; }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 12px 0; }
.stats div { background: var(--card); border-radius: 18px; padding: 12px 10px; box-shadow: var(--shadow); }
.stats b { display: block; font-size: 15px; letter-spacing: -0.03em; margin-top: 4px; }
.stats span { color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: 0.06em; text-transform: uppercase; }
button:disabled { opacity: .35; }
.banner {
  background: var(--green-soft);
  color: var(--green);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 10px;
  font-size: 14px;
  font-weight: 650;
}
.warn {
  background: var(--amber-soft);
  color: #6d4700;
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 10px;
  font-size: 14px;
}
.err { color: var(--red); font-size: 14px; font-weight: 650; margin-top: 8px; }
.weekbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.weekbar b { white-space: nowrap; }
.check { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 15px; }
.check input { width: 22px; height: 22px; min-height: 0; }
.pair { display: flex; gap: 8px; }
.pair .ghost, .pair .primary, .pair .danger { margin-top: 0; }
ol.steps { margin: 8px 0 0; padding-left: 18px; }
ol.steps li { margin: 6px 0; }
a { color: var(--green); }
.loading, .fatal { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 32px; text-align: center; }
</style>
</head>

<script>
// Pure PT Planner rules. No Google calls, no client lists.
// The Apps Script file and the phone screen both use this.
var PT = (function () {
  var EMAIL_SUBJECT = 'PT Planner daily sync';
  var SUMMARY_EMAIL = 'pedrocerdeira81@gmail.com';
  var LOW_AT = 2;
  var EMAIL_CAP = 30;

  var BUILTIN_IGNORE = { 'resumo': true, 'new month': true };
  var STOP_FULL = {
    'lunch': true, 'dinner': true, 'breakfast': true, 'gym': true, 'workout': true,
    'personal': true, 'holiday': true, 'vacation': true, 'birthday': true, 'flight': true,
    'airport': true, 'doctor': true, 'dentist': true, 'haircut': true, 'meeting': true,
    'call': true, 'zoom': true, 'available': true, 'off': true, 'day off': true,
    'travel': true, 'busy': true, 'blocked': true, 'out of office': true, 'ooo': true,
    'focus time': true, 'appointment': true, 'reminder': true, 'notes': true, 'admin': true,
    'break': true, 'commute': true, 'school': true, 'pickup': true, 'birthday party': true
  };

  function pad2(n) {
    n = String(n);
    return n.length < 2 ? '0' + n : n;
  }
  function collapseSpace(s) {
    return String(s == null ? '' : s).replace(/[\u00a0\u200b\u200c\u200d\ufeff]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function normName(s) {
    return collapseSpace(s).toLowerCase();
  }
  function namesMatch(a, b) {
    var x = normName(a), y = normName(b);
    if (!x || !y) return false;
    return x === y;
  }
  function addDaysYmd(ymd, n) {
    var p = String(ymd || '').split('-');
    var dt = new Date(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])));
    if (isNaN(dt.getTime())) return '';
    dt.setUTCDate(dt.getUTCDate() + n);
    return dt.toISOString().slice(0, 10);
  }
  function mondayOf(ymd) {
    var p = String(ymd || '').split('-');
    var dt = new Date(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])));
    if (isNaN(dt.getTime())) return '';
    var day = dt.getUTCDay();
    var diff = day === 0 ? -6 : 1 - day;
    return addDaysYmd(ymd, diff);
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function asAmountString(v) {
    if (v == null || v === '') return '';
    return String(v);
  }
  function inPeriod(d, period) {
    if (!d || !period || !period.start || !period.end) return false;
    var date = String(d).slice(0, 10);
    return date >= String(period.start) && date <= String(period.end);
  }
  function paymentStatusOf(v) {
    v = String(v || '').toLowerCase();
    if (v === 'paid') return 'paid';
    if (v === 'part' || v === 'part-paid' || v === 'part_paid') return 'part';
    return 'unpaid';
  }
  function methodOf(v) {
    v = String(v || '').toLowerCase();
    if (v === 'cash' || v === 'card' || v === 'transfer') return v;
    if (v === 'bank' || v === 'bank transfer') return 'transfer';
    return '';
  }
  function getTier(n) {
    n = Number(n) || 0;
    if (n >= 120) return 0.70;
    if (n >= 101) return 0.65;
    if (n >= 81) return 0.60;
    return 0.45;
  }
  function getTierLabel(n) {
    n = Number(n) || 0;
    if (n >= 120) return '120+ · 70%';
    if (n >= 101) return '101-119 · 65%';
    if (n >= 81) return '81-100 · 60%';
    return 'Up to 80 · 45%';
  }
  function normalizePackage(p, fallbackId) {
    p = p || {};
    var sessions = (p.sessions != null && p.sessions !== '') ? p.sessions : p.packageSessions;
    var value = (p.value != null && p.value !== '') ? p.value : p.packageValue;
    var left = (p.sessionsLeft != null && p.sessionsLeft !== '') ? p.sessionsLeft : '';
    var received = (p.amountReceived != null && p.amountReceived !== '') ? p.amountReceived : '';
    return {
      id: p.id ? String(p.id) : String(fallbackId || uid()),
      sessions: asAmountString(sessions),
      sessionsLeft: left === '' ? '' : String(left),
      value: asAmountString(value),
      startDate: p.startDate ? String(p.startDate).slice(0, 10) : '',
      expiry: p.expiry ? String(p.expiry).slice(0, 10) : '',
      paymentStatus: paymentStatusOf(p.paymentStatus),
      amountReceived: received === '' ? '' : String(received),
      method: methodOf(p.method),
      paymentDate: p.paymentDate ? String(p.paymentDate).slice(0, 10) : '',
      note: p.note != null ? String(p.note) : ''
    };
  }
  function sortPackages(packages) {
    var arr = [], list = packages || [], i, out = [];
    for (i = 0; i < list.length; i++) arr.push({ p: list[i], i: i });
    arr.sort(function (a, b) {
      var as = a.p.startDate || '', bs = b.p.startDate || '';
      if (as < bs) return -1;
      if (as > bs) return 1;
      return a.i - b.i;
    });
    for (i = 0; i < arr.length; i++) out.push(arr[i].p);
    return out;
  }
  function currentPackage(packages) {
    var sorted = sortPackages(packages);
    if (!sorted.length) return null;
    return sorted[sorted.length - 1];
  }
  function withLegacy(client) {
    var cur = currentPackage(client.packages);
    var packages = [], list = client.packages || [], i;
    for (i = 0; i < list.length; i++) {
      packages.push(normalizePackage(list[i], list[i].id));
    }
    return {
      id: String(client.id),
      name: client.name,
      aliases: (client.aliases || []).slice(),
      packages: packages,
      packageSessions: cur ? cur.sessions : '',
      packageValue: cur ? cur.value : '',
      startDate: cur ? cur.startDate : ''
    };
  }
  function migrateClient(c) {
    if (!c || typeof c !== 'object') return null;
    var name = collapseSpace(c.name || '');
    var id = (c.id != null && String(c.id) !== '') ? String(c.id) : uid();
    var packages = [], i, aliases = [], seen = {}, own = normName(name);
    if (Array.isArray(c.packages) && c.packages.length) {
      for (i = 0; i < c.packages.length; i++) packages.push(normalizePackage(c.packages[i], id + '-pkg' + (i + 1)));
    } else {
      packages.push(normalizePackage({
        id: id + '-pkg1',
        sessions: c.packageSessions,
        value: c.packageValue,
        startDate: c.startDate,
        sessionsLeft: c.sessionsLeft,
        expiry: c.expiry,
        paymentStatus: c.paymentStatus,
        amountReceived: c.amountReceived,
        method: c.method,
        paymentDate: c.paymentDate,
        note: c.note
      }, id + '-pkg1'));
    }
    var rawAliases = Array.isArray(c.aliases) ? c.aliases : [];
    for (i = 0; i < rawAliases.length; i++) {
      var label = collapseSpace(rawAliases[i]);
      var n = normName(label);
      if (!n || n === own || seen[n]) continue;
      seen[n] = true;
      aliases.push(label);
    }
    if (!name && (c.id == null || String(c.id) === '')) return null;
    return withLegacy({ id: id, name: name, aliases: aliases, packages: packages });
  }
  function migrateClients(list) {
    if (!Array.isArray(list)) return [];
    var out = [], i, c;
    for (i = 0; i < list.length; i++) {
      c = migrateClient(list[i]);
      if (c && c.name) out.push(c);
    }
    return out;
  }
  function migrateCharge(c) {
    if (!c || typeof c !== 'object') return null;
    var amount = 0;
    if (c.amount != null && c.amount !== '') {
      var n = Number(c.amount);
      amount = isFinite(n) && n >= 0 ? n : 0;
    }
    return {
      id: c.id != null && String(c.id) !== '' ? String(c.id) : uid(),
      clientId: c.clientId != null ? String(c.clientId) : '',
      eventId: c.eventId != null ? String(c.eventId) : '',
      type: c.type ? String(c.type) : 'other',
      date: c.date ? String(c.date).slice(0, 10) : '',
      notes: c.notes != null ? String(c.notes) : '',
      amount: amount,
      createdAt: c.createdAt ? String(c.createdAt) : ''
    };
  }
  function migrateCharges(list) {
    if (!Array.isArray(list)) return [];
    var out = [], i, c;
    for (i = 0; i < list.length; i++) {
      c = migrateCharge(list[i]);
      if (c) out.push(c);
    }
    return out;
  }
  function normalizeComm(c) {
    c = c || {};
    return {
      quota: c.quota != null && c.quota !== '' ? String(c.quota) : '7758',
      netFactor: c.netFactor != null && c.netFactor !== '' ? String(c.netFactor) : '81.63',
      includeCharges: !!c.includeCharges,
      showCommission: c.showCommission === false ? false : true
    };
  }
  function normalizePeriod(p) {
    p = p || {};
    var start = p.start ? String(p.start).slice(0, 10) : '';
    var end = p.end ? String(p.end).slice(0, 10) : '';
    return { id: p.id ? String(p.id) : uid(), start: start, end: end };
  }
  function sortPeriods(list) {
    var out = [], i, p;
    for (i = 0; i < (list || []).length; i++) {
      p = normalizePeriod(list[i]);
      if (!p.start || !p.end || p.end < p.start) continue;
      out.push(p);
    }
    out.sort(function (a, b) {
      if (a.start < b.start) return -1;
      if (a.start > b.start) return 1;
      if (a.end < b.end) return -1;
      if (a.end > b.end) return 1;
      return 0;
    });
    return out;
  }
  function activePeriod(periods, today) {
    var list = sortPeriods(periods), i, hit = null, past = null;
    today = String(today || '');
    for (i = 0; i < list.length; i++) {
      if (today && today >= list[i].start && today <= list[i].end) hit = list[i];
      if (today && list[i].end < today) past = list[i];
    }
    if (hit) return hit;
    if (past) return past;
    return list.length ? list[list.length - 1] : null;
  }
  function savePeriods(existing, fields) {
    var list = sortPeriods(existing);
    var start = fields && fields.start ? String(fields.start).slice(0, 10) : '';
    var end = fields && fields.end ? String(fields.end).slice(0, 10) : '';
    if (!start || !end) throw new Error('Enter the start and the end.');
    if (end < start) throw new Error('The end date is before the start date.');
    var id = fields.id ? String(fields.id) : '';
    var next = [], found = false, i, made = id || uid();
    for (i = 0; i < list.length; i++) {
      if (id && String(list[i].id) === id) {
        next.push({ id: id, start: start, end: end });
        found = true;
      } else next.push(list[i]);
    }
    if (!found) next.push({ id: made, start: start, end: end });
    return { periods: sortPeriods(next), id: found ? id : made };
  }
  function syncWindow(today, periods) {
    var ahead = addDaysYmd(today, 60);
    var fallback = addDaysYmd(today, -60);
    var cap = addDaysYmd(today, -120);
    var period = activePeriod(periods, today);
    var start = (period && period.start) ? period.start : fallback;

    var earned = period ? PT.periodSessionRevenue(state.clients, state.sessions, period, state.today) : 0;
    var due = owes.reduce(function (sum, row) { return sum + row.due; }, 0);
    var est = PT.commissionEstimate({
      sessionRevenue: earned,
      chargeTotal: period ? PT.periodChargeTotal(state.charges, period, state.today) : 0,
      sessionCount: billable.length,
      comm: state.settings
    });
    var body = periodBar();
    body += '<p class="sub" style="margin:12px 0">' + esc(state.lastSync ? ('Last check ' + state.lastSync) : 'Not checked yet') + '</p>';
    body += '<div class="stats"><div><span>Expected</span><b>' + esc(money(earned)) + '</b></div><div><span>To collect</span><b>' + esc(money(due)) + '</b></div><div><span>Commission</span><b>' + (state.settings.showCommission === false ? 'Off' : esc(money(Math.round(est.commission)))) + '</b></div></div>';
    body += '<button type="button" class="primary" data-act="sync">Update from Calendar</button>';
    if (unmatched.length) {
      body += '<button type="button" class="row" data-act="nav" data-go="#review"><div class="grow"><div class="name">' + unmatched.length + (unmatched.length === 1 ? ' name to sort' : ' names to sort') + '</div><div class="note">Only names without PT. PT names are added for you.</div></div></button>';
    }
    body += '<h2>Today</h2>';
    if (!todays.length) body += '<div class="card empty">Nothing on the calendar today.</div>';
    todays.forEach(function (s) { body += sessionButton(s); });
    if (owes.length) {
      body += '<h2>Owes money</h2>';
      owes.forEach(function (row) {
        body += '<button type="button" class="row" data-act="open-client" data-id="' + esc(row.id) + '"><div class="grow"><div class="name">' + esc(row.name) + '</div><div class="note">' + (row.status === 'part' ? 'Part paid' : 'Unpaid') + '</div></div><b>' + esc(money(row.due)) + '</b></button>';
      });
    }
    if (attention.length) body += '<h2>Low or out</h2>';
    attention.forEach(function (c) { body += clientButton(c); });
    if (needs.length) {
      body += '<h2>Set a package</h2>';
      needs.forEach(function (c) { body += clientButton(c); });
    }
    body += '<h2>Packages</h2>';
    var rest = (state.clients || []).slice().sort(function (a, b) {
      return PT.currentRemaining(a, state.sessions, state.clients).remaining - PT.currentRemaining(b, state.sessions, state.clients).remaining;
    });
    if (!rest.length) body += '<div class="card empty">Clients appear when a calendar title contains PT.</div>';
    rest.forEach(function (c) { body += clientButton(c); });
    return shell(longDate(today), body, '');
  }

  function weekScreen() {
    var start = PT.addDaysYmd(PT.mondayOf(state.today), (ui.weekOffset || 0) * 7);
    var end = PT.addDaysYmd(start, 6);
    var a = parseYmd(start), b = parseYmd(end);
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var range = a.getUTCMonth() === b.getUTCMonth()
      ? (a.getUTCDate() + '–' + b.getUTCDate() + ' ' + months[a.getUTCMonth()])
      : (prettyDate(start) + ' – ' + prettyDate(end));
    var body = '<div class="weekbar"><button type="button" class="ghost small" data-act="week" data-id="-1">Previous</button><b>' + esc(range) + '</b><button type="button" class="ghost small" data-act="week" data-id="1">Next</button></div>';
    var d, i, list, label;
    for (i = 0; i < 7; i++) {
      d = PT.addDaysYmd(start, i);
      list = (state.sessions || []).filter(function (s) { return s.date === d && s.disposition === 'kept'; }).sort(PT.compareSessions);
      label = prettyDate(d) + (d === state.today ? ' · Today' : '');
      body += '<div class="day-head"><b class="' + (d === state.today ? 'today-mark' : '') + '">' + esc(label) + '</b><span class="meta">' + list.length + '</span></div>';
      if (!list.length) body += '<div class="meta" style="margin:0 2px 8px">Nothing</div>';
      list.forEach(function (s) { body += sessionButton(s); });
    }
    return shell('Week', body, '');
  }

  function clientsScreen() {
    var body = '<button type="button" class="primary" data-act="new-client">Add a client</button>';
    var list = (state.clients || []).slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    if (!list.length) body += '<div class="card empty">No clients yet.</div>';
    list.forEach(function (c) { body += clientButton(c); });
    return shell('Clients', body, '');
  }

  function clientScreen(id) {
    var c = clientById(id);
    if (!c) return shell('Client', '<div class="card empty">That client is not here.</div>', '#clients');
    var st = PT.currentRemaining(c, state.sessions, state.clients);
    var klass = st.out ? 'out' : (st.low ? 'low' : 'ok');
    var body = '<div class="card"><div class="name" style="font-size:22px">' + esc(c.name) + '</div>' +
      '<div class="hero-num ' + klass + '" style="margin-top:10px;color:' + (!st.ready ? 'var(--ink)' : st.out ? 'var(--red)' : st.low ? 'var(--amber)' : 'var(--green)') + '">' + (st.ready ? (st.remaining + '<small>left</small>') : '<small style="font-size:28px">Set the package</small>') + '</div>' +
      '<p class="meta" style="margin-top:8px">' + (st.ready ? (st.used + ' of ' + st.total + ' used · ' + money(st.remainingValue) + ' left') : 'Add the package size and what is left.') + '</p>' +
      '<div class="grid" style="margin-top:12px"><div class="stat"><b>' + esc(money(st.value)) + '</b><span>Price</span></div><div class="stat"><b>' + esc(money(st.due)) + '</b><span>' + (st.paymentStatus === 'paid' ? 'Paid' : st.paymentStatus === 'part' ? 'Still due' : 'Unpaid') + '</span></div></div>' +
      '<p class="meta">Counts from ' + esc(st.startDate ? prettyDate(st.startDate) : 'the start date') + (st.expiry ? ' · until ' + esc(prettyDate(st.expiry)) : '') + (st.note ? ' · ' + esc(st.note) : '') + '</p>' +
      '<div class="pair" style="margin-top:8px"><button type="button" class="primary" data-act="renew" data-id="' + esc(c.id) + '">Renew</button><button type="button" class="ghost" data-act="fix" data-id="' + esc(c.id) + '">Fix numbers</button></div></div>';
    var packages = PT.sortPackages(c.packages || []);
    if (packages.length > 1) {
      body += '<h2>History</h2>';
      packages.forEach(function (pkg) {
        var used = PT.packageUsed(c, state.sessions, pkg, state.clients);
        var current = PT.currentPackage(c.packages);
        body += '<div class="card"><b>' + (current && current.id === pkg.id ? 'Current package' : 'Earlier package') + '</b><div class="meta" style="margin-top:4px">' + used + ' of ' + esc(pkg.sessions) + ' used · ' + esc(money(pkg.value)) + (pkg.startDate ? ' · from ' + esc(prettyDate(pkg.startDate)) : '') + '</div></div>';
      });
    }
    if ((c.aliases || []).length) body += '<h2>Calendar names</h2><div class="card">' + c.aliases.map(function (a) { return esc(a); }).join(', ') + '</div>';
    var sessions = PT.sessionsForClient(c, state.sessions, state.clients).slice().reverse();
    body += '<h2>Sessions</h2>';
    if (!sessions.length) body += '<div class="card empty">No kept sessions yet.</div>';
    sessions.slice(0, 30).forEach(function (s) { body += sessionButton(s); });
    var charges = (state.charges || []).filter(function (ch) { return String(ch.clientId) === String(c.id); });
    body += '<h2>Charges</h2>';
    if (!charges.length) body += '<div class="card empty">No AED charges.</div>';
    charges.forEach(function (ch) { body += chargeRow(ch); });
    body += '<button type="button" class="ghost" data-act="add-charge" data-id="' + esc(c.id) + '">Add an AED charge</button>';
    body += '<button type="button" class="danger" data-act="ask-delete" data-id="' + esc(c.id) + '">Remove client</button>';
    return shell('', body, '#clients');
  }

  function chargeRow(ch) {
    var c = clientById(ch.clientId);
    return '<div class="card"><div class="spread"><b>' + esc(c ? c.name : 'Client') + '</b><b>' + esc(money(ch.amount)) + '</b></div>' +
      '<div class="meta" style="margin-top:4px">' + esc(chargeLabel(ch.type)) + ' · ' + esc(prettyDate(ch.date)) + '</div>' +
      (ch.notes ? '<div class="note">' + esc(ch.notes) + '</div>' : '') +
      '<div class="pair" style="margin-top:8px"><button type="button" class="ghost small" data-act="edit-charge" data-id="' + esc(ch.id) + '">Edit</button><button type="button" class="ghost small" data-act="delete-charge" data-id="' + esc(ch.id) + '">Remove</button></div></div>';
  }

  function reportScreen() {
    var period = viewedPeriod();
    var billable = period ? PT.periodBillable(state.clients, state.sessions, period, state.today) : [];
    var revenue = period ? PT.periodSessionRevenue(state.clients, state.sessions, period, state.today) : 0;
    var chargeTotal = period ? PT.periodChargeTotal(state.charges, period, state.today) : 0;
    var est = PT.commissionEstimate({
      sessionRevenue: revenue,
      chargeTotal: chargeTotal,
      sessionCount: billable.length,
      comm: state.settings
    });
    var body = periodBar();
    if (!period) return shell('Report', body + '<div class="card empty">Set the pay period and the report will use those dates.</div>', '');
    body += '<div class="card" style="margin-top:12px"><div class="meta">Sessions this period</div><div class="hero-num" style="font-size:48px;margin-top:6px">' + billable.length + '</div><p class="meta">Free sessions are not counted. ' + esc(money(revenue)) + ' expected from packages. Charges ' + esc(money(chargeTotal)) + '.</p></div>';
    if (state.settings.showCommission !== false) {
      body += '<div class="card"><div class="spread"><div class="meta">Commission estimate</div><button type="button" class="ghost small" data-act="nav" data-go="#settings">Settings</button></div>' +
        '<div class="hero-num" style="font-size:40px;color:var(--green);margin:8px 0">' + esc(moneyExact(est.commission)) + '</div>' +
        '<div class="meta">' + esc(est.tierLabel) + ' · ' + billable.length + ' sessions</div>' +
        '<div class="grid" style="margin-top:10px"><div class="stat"><b>' + esc(money(est.totalRevenue)) + '</b><span>Revenue</span></div><div class="stat"><b>' + esc(money(est.netRevenue)) + '</b><span>Net</span></div><div class="stat"><b>' + esc(money(est.quota)) + '</b><span>Quota</span></div><div class="stat"><b>' + esc(money(est.commRevenue)) + '</b><span>Above quota</span></div></div></div>';
    }
    var rows = (state.clients || []).map(function (c) {
      var list = PT.sessionsForClient(c, state.sessions, state.clients).filter(function (s) {
        return PT.inPeriod(s.date, period, state.today);
      });
      var counted = list.filter(function (s) { return s.status !== 'free'; }).length;
      var free = list.length - counted;
      return { name: c.name, counted: counted, free: free };
    }).filter(function (r) { return r.counted || r.free; }).sort(function (a, b) { return b.counted - a.counted; });
    body += '<h2>By client</h2>';
    if (!rows.length) body += '<div class="card empty">No sessions in these dates.</div>';
    rows.forEach(function (r) {
      body += '<div class="card"><div class="spread"><b>' + esc(r.name) + '</b><b>' + r.counted + '</b></div>' +
        (r.free ? '<div class="meta">' + r.free + ' free, not counted</div>' : '') + '</div>';
    });
    body += '<button type="button" class="ghost" data-act="nav" data-go="#charges">Charges in AED</button>';
    return shell('Report', body, '');
  }

  function chargesScreen() {
    var period = viewedPeriod();
    var list = (state.charges || []).filter(function (ch) { return period && PT.inPeriod(ch.date, period); }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var total = list.reduce(function (sum, ch) { return sum + PT.chargeAmount(ch); }, 0);
    var body = periodBar();
    body += '<div class="card" style="margin-top:12px"><div class="meta">Charges this period</div><div class="hero-num" style="font-size:42px;margin-top:6px">' + esc(money(total)) + '</div></div>';
    body += '<button type="button" class="primary" data-act="add-charge">Add a charge</button>';
    if (!period) body += '<div class="card empty">Set the pay period first.</div>';
    else if (!list.length) body += '<div class="card empty">No charges in this period.</div>';
    list.forEach(function (ch) { body += chargeRow(ch); });
    return shell('Charges', body, '#report');

        '<label>Sessions in a new package</label><input data-field="sessions" inputmode="numeric" placeholder="12">' +
        '<label>Package price (AED)</label><input data-field="value" inputmode="decimal" placeholder="4800">' +
        '<label>Package starts</label><input data-field="start" type="date" value="' + esc(state.today) + '">' +
        '<button type="button" class="ghost" data-act="create-name" data-name="' + esc(item.label) + '">Save as a new client</button>' +

      '<label>Starts</label><input data-field="start" type="date" value="' + esc((pkg && pkg.startDate) || state.today) + '">' +
      '<label>Expires, if it does</label><input data-field="expiry" type="date" value="' + esc(pkg && pkg.expiry ? pkg.expiry : '') + '">' +
      '<label>Payment</label><select data-field="paymentStatus">' + opt('unpaid', 'Unpaid', status) + opt('part', 'Part paid', status) + opt('paid', 'Paid', status) + '</select>' +

      '<label>How he paid</label><select data-field="method">' + opt('', 'Not yet', method) + opt('cash', 'Cash', method) + opt('card', 'Card', method) + opt('transfer', 'Bank transfer', method) + '</select>' +

  function localAct(name, args) {
    var a = args[0] || {};
    if (name === 'apiSyncNow') {
      state.lastSync = state.today + ' 05:04 Asia/Dubai';
      ui.toast = 'Example calendar is already loaded.';
      return;
    }
    if (name === 'apiEmailSummary') {
      ui.toast = 'Example only. No email was sent.';
      return;
    }
    if (name === 'apiSetStatus') state.sessions = PT.setStatus(state.sessions, a.eventId, a.status);
    else if (name === 'apiHide') state.sessions = PT.hideSession(state.sessions, a.eventId).filter(function (s) { return !s.hidden; });
    else if (name === 'apiMap') {
      if (a.action === 'ignore') {
        var ig = PT.ignoreName(state.ignored, state.sessions, a.name);
        state.ignored = ig.ignored;
        state.sessions = ig.sessions.filter(function (s) { return s.disposition !== 'ignored'; });
      } else if (a.action === 'create') {
        state.clients = PT.createClient(state.clients, a);
        var created = state.clients[state.clients.length - 1];
        var made = PT.linkName(state.clients, state.sessions, created.id, a.name);
        state.clients = made.clients;
        state.sessions = made.sessions;
      } else {
        var linked = PT.linkName(state.clients, state.sessions, a.clientId, a.name);
        state.clients = linked.clients;
        state.sessions = linked.sessions;
      }
    } else if (name === 'apiSaveClient') {
      if (!a.id) state.clients = PT.createClient(state.clients, a, state.sessions, state.clients);
      else {
        state.clients = state.clients.map(function (c) {
          return String(c.id) === String(a.id) ? PT.saveClientPackage(c, a, state.sessions, state.clients) : c;
        });
      }
    } else if (name === 'apiSavePeriods') {
      var savedPeriods = PT.savePeriods((state.settings && state.settings.periods) || [], a);
      state.settings.periods = savedPeriods.periods;
      ui.periodId = savedPeriods.id;
    } else if (name === 'apiDeleteClient') {
      var removed = PT.deleteClient(state.clients, state.sessions, a.id);
      state.clients = removed.clients;
      state.sessions = removed.sessions.filter(function (s) { return s.disposition !== 'ignored'; });
      state.charges = (state.charges || []).filter(function (ch) { return String(ch.clientId) !== String(a.id); });
      if (route().name === 'client') location.hash = '#clients';
    } else if (name === 'apiSaveCharge') {
      var amount = Number(a.amount);
      if (!isFinite(amount) || amount < 0) throw new Error('Enter an amount in AED, or 0.');
      if (!a.clientId) throw new Error('Choose a client.');
      var entry = PT.migrateCharge({
        id: a.id || ('ch' + Date.now()),
        clientId: a.clientId,
        eventId: a.eventId || '',
        type: a.type || 'other',
        amount: amount,
        date: a.date || state.today,
        notes: a.notes || '',
        createdAt: state.today
      });
      var replaced = false;
      state.charges = (state.charges || []).map(function (ch) {
        if (a.id && String(ch.id) === String(a.id)) { replaced = true; return entry; }
        return ch;
      });
      if (!replaced) state.charges = state.charges.concat([entry]);
    } else if (name === 'apiDeleteCharge') {
      state.charges = (state.charges || []).filter(function (ch) { return String(ch.id) !== String(a.id); });
    } else if (name === 'apiSaveSettings') {
      var comm = PT.normalizeComm(a);
      comm.periods = (state.settings && state.settings.periods) || [];
      state.settings = comm;
    } else if (name === 'apiUnignore') {
      var key = PT.normName(a.name);
      state.ignored = (state.ignored || []).filter(function (n) { return PT.normName(n) !== key; });
    }
  }

  function call(name, args, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var limit = window.PT_CALL_TIMEOUT || timeoutMs || 20000;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        reject(new Error('This is taking too long. Check the connection, then tap Try again.'));
      }, limit);
      function finish(fn, value) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        fn(value);
      }
      try {
        if (!(window.google && google.script && google.script.run)) {
          finish(reject, new Error('Open PT Planner from the Google link, in Safari.'));
          return;
        }
        // google.script.run ignores Function.apply and Function.call, and then
        // neither handler runs. Call the server function directly.
        var runner = google.script.run
          .withSuccessHandler(function (value) { finish(resolve, value); })
          .withFailureHandler(function (err) {
            var message = 'Could not reach PT Planner.';
            if (err && err.message) message = String(err.message);
            else if (typeof err === 'string' && err) message = err;
            finish(reject, new Error(message));
          });
        args = args || [];
        if (args.length === 0) runner[name]();
        else if (args.length === 1) runner[name](args[0]);
        else if (args.length === 2) runner[name](args[0], args[1]);
        else if (args.length === 3) runner[name](args[0], args[1], args[2]);
        else finish(reject, new Error('PT Planner could not send that request.'));
      } catch (err) {
        finish(reject, new Error((err && err.message) || 'PT Planner could not start.'));
      }
    });
  }

  function go(name, args) {
    try {
      if (EXAMPLE) {
        localAct(name, args || [{}]);
        ui.error = '';
        ui.sheet = null;
        render();
        if (ui.toast) {
          var note = ui.toast;
          ui.toast = '';
          var el = document.createElement('div');
          el.className = 'banner';
          el.style.position = 'fixed';
          el.style.left = '16px';
          el.style.right = '16px';
          el.style.bottom = '96px';
          el.style.zIndex = '30';
          el.textContent = note;
          document.body.appendChild(el);
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2200);
        }
        return;
      }
      ui.loading = true;
      var slow = name === 'apiSyncNow' || name === 'apiEmailSummary';
      call(name, args, slow ? 120000 : 20000).then(afterSave).catch(function (err) { ui.loading = false; showError(err.message); });
    } catch (err) {
      showError(err.message);
    }
  }

  function onClick(e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'stop') return;
    if (act === 'close') { ui.sheet = null; ui.error = ''; render(); return; }
    if (act === 'nav') {
      ui.sheet = null;
      var dest = el.getAttribute('data-go');
      if (location.hash !== dest) location.hash = dest;
      else render();
      return;
    }
    if (act === 'week') { ui.weekOffset = (ui.weekOffset || 0) + Number(el.getAttribute('data-id') || 0); render(); return; }
    if (act === 'pick-period') {
      var pick = el.getAttribute('data-id');
      if (!pick) return;
      ui.periodId = pick;
      render();
      return;
    }
    if (act === 'edit-period' || act === 'new-period') {
      var chosen = null;
      if (act === 'edit-period') {
        periodList().forEach(function (p) { if (String(p.id) === String(el.getAttribute('data-id'))) chosen = p; });
      }
      ui.error = '';
      ui.sheet = '<div class="name">' + (act === 'new-period' ? 'Next pay period' : 'Edit pay period') + '</div><p class="meta">Use the exact dates from J Club. Totals update as soon as you save.</p><label>Starts</label><input data-field="pstart" type="date" value="' + esc(chosen ? chosen.start : '') + '"><label>Ends</label><input data-field="pend" type="date" value="' + esc(chosen ? chosen.end : '') + '"><button type="button" class="primary" data-act="save-period" data-id="' + esc(chosen ? chosen.id : '') + '">Save</button>';
      render();
      return;
    }
    if (act === 'save-period') {
      var holder = el.closest('.sheet') || el.closest('.card') || document;
      go('apiSavePeriods', [{ id: el.getAttribute('data-id') || '', start: field('pstart', holder), end: field('pend', holder) }]);
      return;
    }
    if (act === 'session') { openSession(el.getAttribute('data-id')); return; }
    if (act === 'open-client') { location.hash = '#client/' + encodeURIComponent(el.getAttribute('data-id')); return; }
    if (act === 'sync') {
      if (EXAMPLE) { go('apiSyncNow', [{}]); return; }
      beginSync();
      return;
    }
    if (act === 'email') { go('apiEmailSummary', [{}]); return; }
    if (act === 'status') { go('apiSetStatus', [{ eventId: el.getAttribute('data-id'), status: el.getAttribute('data-status') }]); return; }
    if (act === 'hide') { go('apiHide', [{ eventId: el.getAttribute('data-id') }]); return; }
    if (act === 'new-client') { openClientForm(null); return; }
    if (act === 'fix') { openClientForm(clientById(el.getAttribute('data-id'))); return; }
    if (act === 'renew') { openRenew(el.getAttribute('data-id')); return; }
    if (act === 'save-client' || act === 'save-renew') {
      var root = el.closest('.sheet');
      var pack = readPackage(root);
      pack.id = el.getAttribute('data-id');
      pack.mode = act === 'save-renew' ? 'renew' : 'edit';
      go('apiSaveClient', [pack]);
      return;
    }
    if (act === 'ask-delete') { openDelete(el.getAttribute('data-id')); return; }
    if (act === 'delete-client') { go('apiDeleteClient', [{ id: el.getAttribute('data-id') }]); return; }
    if (act === 'add-charge') { ui.sheet = null; openCharge(el.getAttribute('data-id'), el.getAttribute('data-event'), el.getAttribute('data-date')); return; }
    if (act === 'edit-charge') {
      var existing = null;
      (state.charges || []).forEach(function (ch) { if (String(ch.id) === String(el.getAttribute('data-id'))) existing = ch; });
      if (!existing) return;
      openCharge(existing.clientId, existing.eventId, existing.date, existing);
      return;
    }
    if (act === 'save-charge') {
      var box = el.closest('.sheet');
      go('apiSaveCharge', [{
        id: el.getAttribute('data-id') || '',
        clientId: field('clientId', box),
        amount: field('amount', box),
        type: field('type', box) || 'other',
        date: field('date', box),
        notes: field('notes', box),
        eventId: el.getAttribute('data-event') || ''
      }]);
      return;
    }
    if (act === 'delete-charge') { go('apiDeleteCharge', [{ id: el.getAttribute('data-id') }]); return; }
    if (act === 'link' || act === 'ignore' || act === 'create-name') {
      var card = el.closest('.card');
      var name = el.getAttribute('data-name');
      if (act === 'ignore') { go('apiMap', [{ action: 'ignore', name: name }]); return; }
      if (act === 'link') {
        var clientId = field('link', card);
        if (!clientId) { showError('Choose a client.'); return; }
        go('apiMap', [{ action: 'link', name: name, clientId: clientId }]);
        return;
      }
      go('apiMap', [{
        action: 'create',
        name: name,
        sessions: field('sessions', card),
        value: field('value', card),
        startDate: field('start', card) || state.today
      }]);
      return;
    }
    if (act === 'save-settings') {
      go('apiSaveSettings', [{
        showCommission: field('showCommission'),
        includeCharges: field('includeCharges'),
        quota: field('quota'),
        netFactor: field('netFactor')
      }]);
      return;
    }
    if (act === 'unignore') { go('apiUnignore', [{ name: el.getAttribute('data-name') }]); return; }
    if (act === 'retry-boot') { startApp(); return; }
  }

  function render() {
    var root = document.getElementById('app');
    if (!state) {
      var splash = '<div class="app loading"><div><div class="brand"><span class="mark">PT</span> Planner</div>';
      if (ui.fatal) {
        splash += '<p>' + esc(ui.fatal) + '</p><button type="button" class="primary" data-act="retry-boot">Try again</button>';
      } else {
        splash += '<p class="meta">' + esc(ui.status || 'Opening your planner…') + '</p>';
      }
      root.innerHTML = splash + '</div></div>';
      return;
    }
    var r = route();
    var html = '';
    if (r.name === 'week') html = weekScreen();
    else if (r.name === 'clients') html = clientsScreen();
    else if (r.name === 'client') html = clientScreen(r.id);
    else if (r.name === 'report') html = reportScreen();
    else if (r.name === 'charges') html = chargesScreen();
    else if (r.name === 'review') html = reviewScreen();
    else if (r.name === 'settings') html = settingsScreen();
    else html = homeScreen();
    root.innerHTML = html;
  }

  function readBoot() {
    var el = document.getElementById('boot-data');
    if (!el) return null;
    var text = (el.textContent || '').replace(/^\s+|\s+$/g, '');
    if (!text || text === '___PT_BOOT___' || text === 'null') return null;
    try { return JSON.parse(text); } catch (e) { return null; }
  }

  function buildExample() {

      return dates.map(function (date, i) {

          createdAt: '2026-10-01 05:04'
        };
      });
    }
    function pay(client, extra) {

      PT.migrateClient({ id: 'omar', name: 'Omar', packageSessions: '', packageValue: '', startDate: '2026-11-02', paymentStatus: 'unpaid' })
    ];
    var sessions = []
      .concat(many('Larissa', ['2026-09-03', '2026-09-10', '2026-09-17', '2026-10-01', '2026-10-22', '2026-11-05', '2026-11-09', '2026-11-12', '2026-11-16', '2026-11-19', '2026-11-23', '2026-11-26', '2026-11-30'], '07:00'))
      .concat(many('Jeremy', ['2026-08-04', '2026-08-11', '2026-08-18', '2026-08-25', '2026-09-08', '2026-09-15', '2026-09-29', '2026-10-06', '2026-10-20', '2026-10-27'], '09:00'))

      .concat(many('Mohammad family', ['2026-06-04', '2026-06-18', '2026-07-02', '2026-07-16', '2026-08-06', '2026-08-20', '2026-09-10', '2026-10-08', '2026-10-29'], '18:00'))
      .concat(many('Sofia', ['2026-10-06', '2026-10-13', '2026-10-27', '2026-11-06', '2026-11-10', '2026-11-13', '2026-11-17', '2026-11-20', '2026-11-24'], '08:30'));
    sessions.push({
      eventId: 'larissa-today', calendarId: 'example', title: 'Larissa PT', clientName: 'Larissa',
      date: '2026-11-02', start: '07:00', end: '08:00', allDay: false, note: '', status: 'normal',

    });

        { id: 'ch2', clientId: 'sofia', eventId: '', type: 'no_show', amount: 150, date: '2026-10-30', notes: 'Did not arrive', createdAt: '2026-10-30' }
      ],

          { id: 'p1', start: '2026-09-30', end: '2026-10-28' },

  document.addEventListener('click', onClick);
  window.addEventListener('hashchange', function () { ui.sheet = null; render(); });

  function showState(s) {
    state = s;
    ui.boot = readBoot();
    render();
  }
  function pollSync(seen, n) {
    if (n > 20) {
      ui.syncing = false;
      render();
      return;
    }
    setTimeout(function () {
      call('apiGetState', [], 15000).then(function (s) {
        if (s && s.today) state = s;
        if (s && s.lastSync && s.lastSync !== seen) {
          ui.syncing = false;
          render();
          return;
        }
        render();
        pollSync(seen, n + 1);
      }).catch(function () { pollSync(seen, n + 1); });
    }, 4000);
  }
  function beginSync() {
    if (!state) return;
    var seen = state.lastSync || '';
    ui.syncing = true;
    ui.syncError = '';
    render();
    var attempt = 0;
    function run() {
      attempt++;
      call('apiSyncNow', [], 90000).then(function (next) {
        if (next && next.syncing) {
          pollSync(seen, 0);
          return;
        }
        if (next && next.today) state = next;
        ui.syncing = false;
        render();
      }).catch(function (err) {
        if (attempt < 3) {
          setTimeout(run, 4000);
          return;
        }
        ui.syncing = false;
        ui.syncError = (err && err.message) || 'Calendar check did not finish.';
        render();
      });
    }
    run();
  }
  function startApp() {
    ui.fatal = '';
    ui.syncError = '';
    ui.syncing = false;
    ui.status = 'Opening your planner…';
    state = null;
    try { render(); } catch (e) { ui.fatal = (e && e.message) || 'PT Planner could not open.'; }
    call('apiGetState', [], 20000).then(function (s) {
      if (!s || typeof s !== 'object' || !s.today) throw new Error('PT Planner sent an empty reply.');
      ui.status = '';
      showState(s);
      beginSync();
    }).catch(function (err) {
      ui.syncing = false;
      ui.fatal = (err && err.message) || 'PT Planner could not open.';
      state = null;
      try { render(); } catch (e2) {}
    });
  }

  if (!EXAMPLE && !(window.google && google.script && google.script.run)) {
    document.getElementById('app').innerHTML = '<div class="app fatal"><div><div class="brand"><span class="mark">PT</span> Planner</div><p>Open the Google link on your iPhone. This file is only the screen.</p><p><a href="?example=1#home">View example screens</a></p></div></div>';
  } else if (EXAMPLE) {
    state = buildExample();
    render();
  } else {
    startApp();
  }
})();
