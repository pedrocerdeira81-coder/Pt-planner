<!DOCTYPE html>
<html lang="en">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PT Planner">
<meta name="theme-color" content="#f0efe9">
<title>PT Planner</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f0efe9}
body{overscroll-behavior:none;-webkit-font-smoothing:antialiased}
input,select,textarea{-webkit-appearance:none;appearance:none;outline:none}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.35}
::-webkit-scrollbar{width:0}
/* Safe areas keep the header and tab bar clear of the iPhone notch and home indicator. */
.pt-header{
  background:#fff;
  border-bottom:1px solid rgba(0,0,0,0.08);
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  flex-wrap:wrap;
  padding:18px 20px 14px;
  padding-top:calc(18px + constant(safe-area-inset-top));
  padding-top:calc(18px + env(safe-area-inset-top));
  padding-left:calc(20px + constant(safe-area-inset-left));
  padding-left:calc(20px + env(safe-area-inset-left));
  padding-right:calc(20px + constant(safe-area-inset-right));
  padding-right:calc(20px + env(safe-area-inset-right));
}
.pt-header-actions{display:flex;gap:8px;margin-left:auto;flex-shrink:0}
.pt-main{
  padding:20px 16px 96px;
  padding-left:calc(16px + constant(safe-area-inset-left));
  padding-left:calc(16px + env(safe-area-inset-left));
  padding-right:calc(16px + constant(safe-area-inset-right));
  padding-right:calc(16px + env(safe-area-inset-right));
  padding-bottom:calc(96px + constant(safe-area-inset-bottom));
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
.pt-tabs{
  position:fixed;left:0;right:0;bottom:0;
  background:#fff;
  border-top:1px solid rgba(0,0,0,0.08);
  display:flex;
  z-index:20;
  box-shadow:0 -4px 16px rgba(0,0,0,0.06);
  padding:10px 0 14px;
  padding-bottom:calc(14px + constant(safe-area-inset-bottom));
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
  padding-left:constant(safe-area-inset-left);
  padding-left:env(safe-area-inset-left);
  padding-right:constant(safe-area-inset-right);
  padding-right:env(safe-area-inset-right);
}
.pt-fab{
  position:fixed;z-index:10;
  width:56px;height:56px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;cursor:pointer;border:none;
  bottom:100px;
  bottom:calc(100px + constant(safe-area-inset-bottom));
  bottom:calc(100px + env(safe-area-inset-bottom));
  right:20px;
  right:calc(20px + constant(safe-area-inset-right));
  right:calc(20px + env(safe-area-inset-right));
}
.pt-overlay{
  position:fixed;inset:0;z-index:40;
  background:rgba(0,0,0,0.45);
  display:flex;align-items:flex-end;
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
}
.pt-sheet{
  background:#fff;
  border-radius:26px 26px 0 0;
  width:100%;
  max-height:88vh;
  overflow-y:auto;
  padding:8px 20px 48px;
  padding-bottom:calc(48px + constant(safe-area-inset-bottom));
  padding-bottom:calc(48px + env(safe-area-inset-bottom));
  padding-left:calc(20px + constant(safe-area-inset-left));
  padding-left:calc(20px + env(safe-area-inset-left));
  padding-right:calc(20px + constant(safe-area-inset-right));
  padding-right:calc(20px + env(safe-area-inset-right));
}
</style>
</head>
<body>
<div id="root"></div>
<script id="pt-logic">
var PT = (function () {
  var DAY = 86400000;

  }

  function getTier(n) {

    if (n >= 101) return 0.65;
    if (n >= 81) return 0.60;
    return 0.45;
  }
  function getTierLabel(n) {

    if (n >= 81) return '81-100 \u00b7 60%';
    return 'Up to 80 \u00b7 45%';
  }
  function normalizePackage(p, fallbackId) {

    var value = (p.value != null && p.value !== '') ? p.value : p.packageValue;

    return out;
  }
  function currentPackage(packages) {
    var sorted = sortPackages(packages);
    if (!sorted.length) return null;
    return sorted[sorted.length - 1];
  }
  function withLegacy(client) {
    var cur = currentPackage(client.packages);
    var packages = [], list = client.packages || [], i;
    for (i = 0; i < list.length; i++) {
      packages.push({
        id: String(list[i].id),
        sessions: list[i].sessions,
        value: list[i].value,
        startDate: list[i].startDate

    return {

      aliases: (client.aliases || []).slice(),

      clientId: c.clientId != null ? String(c.clientId) : '',

      date: c.date ? String(c.date) : '',

    var n = normName(sessionName), out = [], list = clients || [], i, j;

      for (j = 0; j < aliases.length; j++) {

    return out;
  }
  function findClient(clients, sessionName) {
    var hits = clientsForName(clients, sessionName);
    return hits.length === 1 ? hits[0] : null;
  }
  function sessionCountsFor(client, allClients, sessionName) {
    if (!client) return false;
    var owner = findClient(allClients || [client], sessionName);
    return !!(owner && String(owner.id) === String(client.id));
  }
  function packageForDate(packages, date) {
    var sorted = sortPackages(packages), found = null, i, start;
    for (i = 0; i < sorted.length; i++) {

      found = sorted[i];

    return found;
  }
  function packageWindow(packages, pkg) {
    var sorted = sortPackages(packages), idx = -1, i, next;
    for (i = 0; i < sorted.length; i++) {

    }

    return {start: (pkg && pkg.startDate) || '', end: next && next.startDate ? next.startDate : ''};
  }
  function sessionInWindow(date, w) {
    if (!date) return false;
    if (w.start && String(date) < String(w.start)) return false;
    if (w.end && String(date) >= String(w.end)) return false;
    return true;
  }
  function packageUsed(client, sessions, pkg, allClients) {
    if (!client || !pkg) return 0;
    var w = packageWindow(client.packages, pkg), n = 0, list = sessions || [], i;
    for (i = 0; i < list.length; i++) {
      if (!sessionCountsFor(client, allClients, list[i].clientName)) continue;
      if (!sessionInWindow(list[i].date, w)) continue;
      n++;
    }
    return n;
  }
  function sessionRate(pkg) {
    var n = Number(pkg && pkg.sessions);
    if (!(n > 0)) return 0;

  function rateForSessionDate(packages, date) {

  function periodSessionRevenue(clients, sessions, period, now) {
    var total = 0, list = sessions || [], i, owner;
    for (i = 0; i < list.length; i++) {
      if (!inPeriod(list[i].date, period, now)) continue;
      owner = findClient(clients, list[i].clientName);
      if (!owner) continue;
      total += rateForSessionDate(owner.packages, list[i].date);
    }
    return total;
  }
  function chargeAmount(ch) {
    var n = Number(ch && ch.amount);
    return isFinite(n) ? n : 0;
  }
  function periodChargeTotal(charges, period, now) {
    var total = 0, list = charges || [], i;
    for (i = 0; i < list.length; i++) {
      if (!inPeriod(list[i].date, period, now)) continue;
      total += chargeAmount(list[i]);
    }
    return total;
  }
  function periodChargeTotalFor(charges, clientId, period, now) {
    var total = 0, list = charges || [], i;
    for (i = 0; i < list.length; i++) {

      total += chargeAmount(list[i]);

    return total;
  }
  function chargeTotalFor(charges, clientId) {
    var total = 0, list = charges || [], i;
    for (i = 0; i < list.length; i++) {

    }
    return total;
  }
  function commissionEstimate(opts) {
    opts = opts || {};
    var comm = normalizeComm(opts.comm);
    var sessionRevenue = Number(opts.sessionRevenue) || 0;
    var chargeTotal = Number(opts.chargeTotal) || 0;
    var sessionCount = Number(opts.sessionCount) || 0;

      if (start && list[i].date < start) continue;
      out.push(list[i]);
    }
    out.sort(function (a, b) {
      if (a.date < b.date) return -1;
      if (a.date > b.date) return 1;
      return 0;

    return out;
  }
  function unmatchedNames(sessions, clients) {
    var map = {}, list = sessions || [], i, n, hits, key;
    for (i = 0; i < list.length; i++) {

    return out;

  function assertClientName(clients, name, exceptId) {
    var n = normName(name), list = clients || [], i, j;

      var aliases = list[i].aliases || [];

  function updatePackageById(client, packageId, fields) {

    if (modal === 'session' && editId === s.id) closeModal();
  }
  function linkAlias(group) {
    var clientId = aliasPick[group.key];
    if (!clientId) { setAliasMsg('Choose which client "' + group.label + '" belongs to.'); return; }
    try {
      saveClients(PT.addAlias(clients, clientId, group.label));
      setAliasMsg('');
    } catch (e) { setAliasMsg(e.message); }
  }

  function importSessions() {
    try {
      var parsed = PT.parseImport(importText);
      mergeRef.current(parsed);
      setShowImport(false);
      setImportText('');
    } catch (e) {
      setSyncStatus('Error: ' + e.message);
      setTimeout(function () { setSyncStatus(''); }, 5000);
    }
  }

  function backupObject() {
    return PT.buildBackup({
      clients:clients,
      sessions:sessions,
      lastSync:lastSync,
      charges:charges,
      period:period,
      comm:commSettings
    });
  }
  function backupJson() { return JSON.stringify(backupObject(), null, 2); }
  function openBackup() {
    setBackupMsg('');
    setRestorePreview(null);
    setShowBackup(true);
  }
  async function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) {}
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', 'readonly');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.width = '100%';
      ta.style.height = '80px';
      ta.style.fontSize = '16px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return !!ok;
    } catch (e2) { return false; }
  }
  async function onCopyBackup() {
    var json = backupJson();
    var ok = await copyText(json);
    if (ok) {
      markBackup();
      setBackupMsg('Copied. Paste it into Restore on the phone you want, then tap Replace.');
    } else {
      setBackupJsonShown(json);
      setShowBackupText(true);
      setBackupMsg('Press and hold the text below, choose Select All, then Copy.');
    }
  }
  function onDownloadBackup() {
    var json = backupJson();
    var blob = new Blob([json], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'pt-planner-backup-' + PT.todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    markBackup();
    setBackupMsg('Download started. On iPhone, Copy backup is the sure way if the file only opens on screen.');
  }
  async function onShareBackup() {
    var json = backupJson();
    var file = new File([json], 'pt-planner-backup-' + PT.todayStr() + '.json', {type:'application/json'});
    try {
      if (navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:'PT Planner backup'});
      else if (navigator.share) await navigator.share({title:'PT Planner backup', text:json});
      else { setBackupMsg('Sharing is not available here. Use Copy backup.'); return; }
      markBackup();
      setBackupMsg('Shared. Open Backup in the other copy of PT Planner and restore that file.');
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      setBackupMsg('Sharing did not work. Use Copy backup.');
    }
  }
  function toggleBackupText() {
    if (showBackupText) { setShowBackupText(false); return; }
    setBackupJsonShown(backupJson());
    setShowBackupText(true);
  }
  function checkRestore() {
    try {
      setRestorePreview(PT.parseBackup(restoreText));
      setBackupMsg('');
    } catch (e) {
      setRestorePreview(null);
      setBackupMsg(e.message || 'Could not read that backup.');
    }
  }
  function onRestoreFile(e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result || '');
      setRestoreText(text);
      try {
        setRestorePreview(PT.parseBackup(text));
        setBackupMsg('');
      } catch (err) {
        setRestorePreview(null);
        setBackupMsg(err.message || 'Could not read that file.');
      }
    };
    reader.readAsText(file);
  }
  function applyRestore() {
    if (!restorePreview) return;
    saveClients(restorePreview.clients);
    persistSessions(restorePreview.sessions, restorePreview.lastSync || null);
    saveCharges(restorePreview.charges);
    savePeriod(restorePreview.period);
    saveCommSettings(restorePreview.comm);
    markBackup();
    setRestorePreview(null);
    setRestoreText('');
    setShowBackupText(false);
    setShowBackup(false);
    setBackupMsg('');
    setSyncStatus('Backup restored');
    setTimeout(function () { setSyncStatus(''); }, 4000);
  }

  const chargeLabels = {late_cancel:'Late Cancel', no_show:'No Show', other:'Other'};
  const inp = {background:C.surface, border:'1.5px solid ' + C.border, borderRadius:14, padding:'14px 16px', color:C.txt, fontSize:16, width:'100%', marginBottom:12, boxSizing:'border-box', fontFamily:'inherit', fontWeight:500};
  const goldBtn = {backgroundImage:C.gradGold, color:C.black, border:'none', borderRadius:14, padding:'16px', width:'100%', fontSize:15, fontWeight:800, cursor:'pointer', marginTop:8, boxShadow:C.shadowGold};
  const ghostBtn = {background:'transparent', color:C.charcoal, border:'1.5px solid rgba(0,0,0,0.15)', borderRadius:14, padding:'14px', width:'100%', fontSize:14, fontWeight:600, cursor:'pointer', marginTop:8};
  const primaryBtn = {backgroundImage:C.gradDark, color:'#fff', border:'none', borderRadius:14, padding:'16px', width:'100%', fontSize:15, fontWeight:700, cursor:'pointer', marginTop:8, boxShadow:C.shadowDark};

  const miniDanger = {border:'none', background:'#fee2e2', borderRadius:9, padding:'5px 8px', fontSize:11, fontWeight:700, color:C.red, cursor:'pointer'};
  const rowBtn = {flex:'1 1 40%', padding:'12px', fontSize:13, border:'1.5px solid ' + C.border, borderRadius:14, background:C.surface, color:C.mid, fontWeight:700, cursor:'pointer'};
  const rowPrimary = Object.assign({}, primaryBtn, {flex:'1 1 40%', padding:'12px', fontSize:13, marginTop:0});

  const periodSess = sessions.filter(function (s) { return PT.inPeriod(s.date, period); });
  const viewSess = sessions.filter(function (s) { return s.date === viewDate; });
  const unmatched = PT.unmatchedNames(sessions, clients);
  const sessionRevenueTotal = PT.periodSessionRevenue(clients, sessions, period);
  const periodChargeSum = PT.periodChargeTotal(charges, period);
  const estimate = PT.commissionEstimate({
    sessionRevenue:sessionRevenueTotal,
    chargeTotal:periodChargeSum,
    sessionCount:periodSess.length,
    comm:commSettings
  });
  const hasData = clients.length + sessions.length + charges.length > 0;
  const showReminder = PT.shouldRemindBackup(meta, Date.now(), hasData);

  function periodLabel() {
    if (!period.start || !period.end) return MONTHS[new Date().getMonth()];
    return fmt(period.start) + ' - ' + fmt(period.end);
  }
  function statsFor(c) {
    var cur = PT.currentPackage(c.packages) || {id:'', sessions:'', value:'', startDate:''};
    var total = Number(cur.sessions) || 0;
    var used = PT.packageUsed(c, sessions, cur, clients);
    var over = total > 0 && used > total ? used - total : 0;
    var rem = Math.max(0, total - used);
    var per = total > 0 ? (Number(cur.value || 0) / total) : 0;
    var periodCount = 0, i;
    for (i = 0; i < sessions.length; i++) {
      if (PT.inPeriod(sessions[i].date, period) && PT.sessionCountsFor(c, clients, sessions[i].clientName)) periodCount++;
    }
    return {
      cur:cur, total:total, used:used, rem:rem, over:over, per:per,
      remVal:Math.max(0, rem * per), periodCount:periodCount,
      isLow:rem <= 2 && rem > 0, isDone:rem === 0 && total > 0
    };
  }
  function errorLine() {
    if (!formError) return null;
    return <div style={{color:C.red, fontSize:13, fontWeight:700, marginBottom:10, lineHeight:1.4}}>{formError}</div>;
  }
  function renderCharge(ch) {
    var amt = PT.chargeAmount(ch);
    return (
      <div key={ch.id} style={{background:C.surface, borderRadius:13, padding:'12px 14px', marginBottom:8}}>

          <button onClick={function () { delCharge(ch.id); }} style={miniDanger}>Remove</button>
        </div>
      </div>
    );
  }
  function knownClient(id) {
    var i;
    for (i = 0; i < clients.length; i++) if (clients[i].id === id) return true;
    return false;
  }
  var orphanFees = 0, ci;
  for (ci = 0; ci < charges.length; ci++) {
    if (knownClient(charges[ci].clientId)) continue;

    orphanFees += PT.chargeAmount(charges[ci]);
  }

  if (!loaded) {
    return <div style={{background:C.bg, minHeight:'100dvh', display:'flex', alignItems:'center', justifyContent:'center', color:C.muted, paddingTop:'env(safe-area-inset-top)'}}>Loading...</div>;
  }

  var previewCounts = restorePreview ? {

  } : null;

  return (

          <div style={{fontSize:22, fontWeight:900, letterSpacing:-0.7, color:C.black}}>

          </div>
          <div style={{fontSize:11, color:C.muted, marginTop:1, fontWeight:500}}>

        </div>
        <div className="pt-header-actions">
          <button data-ui="backup-open" onClick={openBackup} style={{background:'#fff', color:C.charcoal, border:'1.5px solid rgba(0,0,0,0.15)', borderRadius:12, padding:'8px 12px', fontSize:12, fontWeight:800, cursor:'pointer'}}>Backup</button>
          <button onClick={function () { setShowImport(true); }} style={{backgroundImage:C.gradDark, color:'#fff', border:'none', borderRadius:12, padding:'9px 14px', fontSize:12, fontWeight:700, cursor:'pointer', boxShadow:C.shadowDark}}>Import</button>
        </div>
      </div>

      <div className="pt-main">
        {tab === 'dashboard' &&
        <div>
          {showReminder &&
          <div style={{background:C.card, borderRadius:18, padding:'16px', marginBottom:14, boxShadow:C.shadow, borderLeft:'3px solid ' + C.gold}}>
            <div style={{fontSize:14, fontWeight:800, marginBottom:4}}>{meta.backupAt ? 'Time for a fresh backup' : 'Save a backup'}</div>
            <div style={{fontSize:13, color:C.mid, lineHeight:1.45}}>
              {meta.backupAt
                ? ('Last backup was ' + fmt(PT.localDateStr(meta.backupAt)) + '. Save a fresh copy when you can.')
                : 'You have not saved a backup yet. Your clients live only in this app on this phone.'}
            </div>
            <div style={{display:'flex', gap:8, marginTop:12}}>
              <button onClick={openBackup} style={Object.assign({}, primaryBtn, {flex:1, width:'auto', marginTop:0, padding:'12px', fontSize:13})}>Back up now</button>
              <button onClick={snoozeBackup} style={Object.assign({}, ghostBtn, {flex:1, width:'auto', marginTop:0, padding:'12px', fontSize:13})}>Remind me later</button>
            </div>
          </div>}

          {unmatched.length > 0 &&
          <div data-ui="unmatched-banner" onClick={function () { setTab('clients'); }} style={{background:C.card, borderRadius:18, padding:'14px 16px', marginBottom:14, boxShadow:C.shadow, borderLeft:'3px solid ' + C.warn, cursor:'pointer'}}>
            <div style={{fontWeight:800, fontSize:14}}>{unmatched.length} name{unmatched.length === 1 ? '' : 's'} not linked to a client</div>
            <div style={{fontSize:12, color:C.muted, marginTop:4}}>Tap to link them so those sessions count for the right person.</div>
          </div>}

          <div style={{backgroundImage:C.gradHero, borderRadius:24, padding:'26px 24px', marginBottom:16, boxShadow:C.shadowDark, position:'relative', overflow:'hidden'}}>
            <div style={{position:'absolute', top:0, left:24, right:24, height:2, backgroundImage:C.gradGold, borderRadius:99}} />
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end', position:'relative'}}>
              <div>
                <div style={{fontSize:11, fontWeight:700, color:'rgba(255,255,255,0.4)', textTransform:'uppercase', letterSpacing:2, marginBottom:8}}>{viewDate === PT.todayStr() ? 'Today' : fmt(viewDate)}</div>
                <div style={{fontSize:62, fontWeight:900, lineHeight:1, letterSpacing:-3, backgroundImage:C.gradGold, WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text'}}>{viewSess.length}</div>
                <div style={{fontSize:12, color:'rgba(255,255,255,0.35)', marginTop:5, fontWeight:600, textTransform:'uppercase'}}>sessions</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:11, fontWeight:700, color:'rgba(255,255,255,0.4)', textTransform:'uppercase', letterSpacing:2, marginBottom:8}}>Period</div>
                <div style={{fontSize:62, fontWeight:900, lineHeight:1, letterSpacing:-3, color:'#fff'}}>{periodSess.length}</div>
                <div data-ui="period-label" onClick={openPeriod} style={{fontSize:11, color:'rgba(201,151,58,0.7)', marginTop:5, cursor:'pointer', fontWeight:600}}>{periodLabel()}</div>
              </div>
            </div>
          </div>

          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14, gap:8}}>
            <div style={{fontSize:11, fontWeight:800, color:C.mid, textTransform:'uppercase', letterSpacing:1.5}}>Sessions</div>
            <div style={{display:'flex', gap:8, alignItems:'center'}}>
              <button data-ui="add-session" onClick={function () { openAddSession({date:viewDate}); }} style={{background:'transparent', color:C.black, border:'1.5px solid rgba(0,0,0,0.12)', borderRadius:10, padding:'6px 12px', fontSize:12, fontWeight:800, cursor:'pointer'}}>Add</button>
              <input data-ui="view-date" type="date" value={viewDate} onChange={function (e) { setViewDate(e.target.value); }} style={{background:C.card, border:'1.5px solid ' + C.border, borderRadius:10, padding:'6px 12px', color:C.txt, fontSize:12, fontWeight:700, cursor:'pointer', boxShadow:C.shadow}} />
            </div>
          </div>
          {viewSess.length === 0
            ? <div style={{background:C.card, borderRadius:18, padding:'22px', textAlign:'center', color:C.muted, fontSize:13, boxShadow:C.shadow, marginBottom:12}}>No sessions this day</div>
            : viewSess.map(function (s) {
              return (
                <div key={s.id} style={{background:C.card, borderRadius:16, padding:'14px 16px', marginBottom:10, boxShadow:C.shadow, display:'flex', alignItems:'center', gap:10}}>
                  <div style={{width:42, height:42, borderRadius:13, backgroundImage:C.gradDark, display:'flex', alignItems:'center', justifyContent:'center', fontSize:19, flexShrink:0}}>💪</div>
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{fontWeight:700, fontSize:15, color:C.txt}}>{s.clientName || s.title}</div>
                    <div style={{fontSize:12, color:C.muted, marginTop:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{s.title}</div>
                  </div>
                  <button data-ui="edit-session" style={miniBtn} onClick={function () { openEditSession(s); }}>Edit</button>
                  <button data-ui="delete-session" style={miniDanger} onClick={function () { askDeleteSession(s); }}>Delete</button>
                </div>

            })
          }

          {clients.length > 0 &&
          <div>
            <div style={{fontSize:11, fontWeight:800, color:C.mid, textTransform:'uppercase', letterSpacing:1.5, marginBottom:14, marginTop:6}}>Clients</div>

              var st = statsFor(c);

              return (
                <div key={c.id} style={{background:C.card, borderRadius:20, padding:'16px 18px', marginBottom:12, boxShadow:C.shadow, borderLeft:'3px solid ' + (st.isDone ? C.red : st.isLow ? C.warn : C.gold)}}>

                    <span style={{color:st.isDone ? C.red : st.isLow ? C.warn : C.green, fontWeight:700}}>{st.over ? st.over + ' over' : st.rem + ' remaining'}</span>
                  </div>
                  <div style={{display:'flex', justifyContent:'space-between', fontSize:12, marginTop:8, paddingTop:8, borderTop:'1px solid ' + C.border, color:C.muted}}>
                    <span>Since {c.startDate ? fmt(c.startDate) : '-'}</span>
                    <span style={{color:C.green, fontWeight:700}}>AED {Number(st.remVal.toFixed(0)).toLocaleString()} left</span>
                  </div>
                </div>
              );
            })}
          </div>}
        </div>}

        {tab === 'clients' &&
        <div>
          <div style={{fontSize:11, fontWeight:800, color:C.mid, textTransform:'uppercase', letterSpacing:1.5, marginBottom:14}}>Clients &middot; {clients.length}</div>
          {unmatched.length > 0 &&
          <div style={{marginBottom:16}}>
            <div style={{fontSize:11, fontWeight:800, color:C.warn, textTransform:'uppercase', letterSpacing:1.5, marginBottom:8}}>Names to link</div>
            <div style={{fontSize:13, color:C.mid, lineHeight:1.45, marginBottom:10}}>These names are on sessions but do not match a client exactly. Link a name once and every session with that name counts for the client you pick.</div>
            {aliasMsg && <div style={{color:C.red, fontSize:13, fontWeight:700, marginBottom:8}}>{aliasMsg}</div>}
            {unmatched.map(function (u) {
              return (
                <div key={u.key} style={{background:C.card, borderRadius:16, padding:'14px', marginBottom:10, boxShadow:C.shadow, borderLeft:'3px solid ' + C.warn}}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:8, gap:8}}>
                    <div style={{fontWeight:800, fontSize:15}}>{u.label}</div>
                    <div style={{fontSize:12, color:C.muted, fontWeight:700}}>{u.count} session{u.count === 1 ? '' : 's'}</div>
                  </div>
                  {u.ambiguous
                    ? <div style={{fontSize:13, color:C.mid, lineHeight:1.45}}>This name matches more than one client. Rename one of them and the sessions will know where to go.</div>
                    : clients.length === 0
                      ? <div style={{fontSize:13, color:C.mid}}>Add the client first, then come back and link this name.</div>
                      : <div>
                        <select data-ui={'alias-' + u.key} style={inp} value={aliasPick[u.key] || ''} onChange={function (e) { setAliasMsg(''); setAliasPick(function (p) { var n = Object.assign({}, p); n[u.key] = e.target.value; return n; }); }}>
                          <option value="">Choose client...</option>
                          {clients.map(function (c) { return <option key={c.id} value={c.id}>{c.name}</option>; })}
                        </select>
                        <button data-ui={'link-' + u.key} style={Object.assign({}, primaryBtn, {marginTop:0})} onClick={function () { linkAlias(u); }}>Link to client</button>
                      </div>}
                </div>
              );
            })}
          </div>}

          {clients.length === 0
            ? <div style={{background:C.card, borderRadius:20, padding:'48px 20px', textAlign:'center', boxShadow:C.shadow}}>
              <div style={{fontSize:48, marginBottom:12}}>👤</div>
              <div style={{color:C.muted, fontSize:14}}>Tap + to add your first client</div>
            </div>
            : clients.map(function (c) {
              var st = statsFor(c);
              var pct = st.total > 0 ? Math.min(100, (st.used / st.total) * 100) : 0;
              var isExp = expanded === c.id;
              var ch_ = PT.chargeTotalFor(charges, c.id);
              var chargeCount = charges.filter(function (ch) { return ch.clientId === c.id; }).length;
              var clientSessions = PT.sessionsForClient(c, sessions, clients);
              var past = PT.sortPackages(c.packages || []).slice(0, -1);
              return (
                <div key={c.id} style={{background:C.card, borderRadius:20, padding:'16px 18px', marginBottom:12, boxShadow:C.shadow, borderLeft:'3px solid ' + (st.isDone ? C.red : st.isLow ? C.warn : C.gold)}}>
                  <div style={{display:'flex', justifyContent:'space-between', cursor:'pointer'}} onClick={function () { setExpanded(isExp ? null : c.id); }}>
                    <div style={{fontSize:17, fontWeight:800}}>{c.name}</div>
                    <span style={{color:C.muted, fontSize:11}}>{isExp ? '\u25b2' : '\u25bc'}</span>
                  </div>

                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8}}>
                    {[['Used', st.used, C.charcoal], ['Left', st.rem, st.isDone ? C.red : st.isLow ? C.warn : C.green], ['Total', st.total, C.gold]].map(function (arr) {

                      {[
                        ['Package Value', 'AED ' + Number(st.cur.value || 0).toLocaleString(), C.charcoal],
                        ['Remaining', 'AED ' + Number(st.remVal.toFixed(0)).toLocaleString(), C.green],
                        ['Per Session', 'AED ' + Number(st.per).toFixed(0), C.mid],

                        return (
                          <div key={arr[0]} style={{background:C.surface, borderRadius:13, padding:'11px 14px'}}>

                    <div style={{marginBottom:12}}>
                      <div style={{fontSize:10, fontWeight:800, color:C.muted, letterSpacing:1, textTransform:'uppercase', marginBottom:8}}>Previous packages</div>

                          <div key={pkg.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:8, background:C.surface, borderRadius:12, padding:'10px 12px', marginBottom:6}}>

                        {c.aliases.map(function (a) {

                              {a}
                              <button onClick={function () { saveClients(PT.removeAlias(clients, c.id, a)); }} style={{border:'none', background:'transparent', color:C.muted, fontWeight:800, cursor:'pointer', fontSize:14, lineHeight:1}} aria-label={'Remove ' + a}>&times;</button>
                            </span>
                          );
                        })}

                    </div>}

                        return (
                          <div key={s.id} style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:8, padding:'8px 0', borderTop:'1px solid ' + C.border}}>
                            <span style={{fontSize:13, fontWeight:700}}>{fmt(s.date)}</span>
                            <span style={{display:'flex', gap:6}}>
                              <button data-ui="edit-client-session" style={miniBtn} onClick={function () { openEditSession(s); }}>Edit</button>

                            </span>
                          </div>
                        );
                      })}
                    </div>
                    <div style={{display:'flex', flexWrap:'wrap', gap:8}}>
                      <button style={rowPrimary} onClick={function () { openEdit(c); }}>Edit</button>
                      <button style={rowBtn} onClick={function () { openRenew(c); }}>Renew package</button>
                      <button style={rowBtn} onClick={function () { openAddSession({clientId:c.id, date:PT.todayStr()}); }}>+ Session</button>
                      <button style={rowBtn} onClick={function () { openAdd('charge', {clientId:c.id}); }}>+ Charge</button>
                    </div>
                  </div>}
                </div>
              );
            })
          }
        </div>}

        {tab === 'report' &&

            <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end'}}>

                <div style={{fontSize:11, color:'rgba(255,255,255,0.3)', marginTop:3}}>{clients.length} clients</div>
              </div>
            </div>
          </div>

              AED {estimate.commission.toLocaleString('en', {maximumFractionDigits:2})}

            <div style={{display:'flex', justifyContent:'space-between', marginBottom:4}}>
              <span style={{fontSize:11, color:C.muted, fontWeight:600}}>Tier ({periodSess.length} sessions)</span>
              <span style={{fontSize:12, fontWeight:800, color:C.charcoal}}>{PT.getTierLabel(periodSess.length)}</span>
            </div>
            <div data-ui="charge-rule" style={{fontSize:12, color:C.mid, fontWeight:600, lineHeight:1.45, marginTop:8}}>
              Session revenue AED {money(sessionRevenueTotal)}

              Charges this period AED {money(periodChargeSum)} &middot; {estimate.includeCharges ? 'included in commission' : 'not in your commission'}
            </div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginTop:10, paddingTop:10, borderTop:'1px solid ' + C.border}}>
              {[
                ['Total Revenue', 'AED ' + money0(estimate.totalRevenue)],
                ['Net Revenue', 'AED ' + money0(estimate.netRevenue)],
                ['Quota', 'AED ' + money0(estimate.quota)],

                return (
                  <div key={arr[0]} style={{background:C.surface, borderRadius:12, padding:'9px 12px'}}>
                    <div style={{fontSize:13, fontWeight:800, color:C.charcoal}}>{arr[1]}</div>
                    <div style={{fontSize:9, color:C.muted, marginTop:2, fontWeight:700, textTransform:'uppercase', letterSpacing:0.8}}>{arr[0]}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {clients.map(function (c) {
            var ps = periodSess.filter(function (s) { return PT.sessionCountsFor(c, clients, s.clientName); }).sort(function (a, b) { return a.date > b.date ? 1 : a.date < b.date ? -1 : 0; });
            var fee = PT.periodChargeTotalFor(charges, c.id, period);
            return {client:c, ps:ps, fee:fee};
          }).filter(function (row) { return row.ps.length > 0 || row.fee > 0; })
            .sort(function (a, b) { return b.ps.length - a.ps.length || b.fee - a.fee; })
            .map(function (row, i) {
              var c = row.client;
              return (
                <div key={c.id} style={{background:C.card, borderRadius:20, padding:'16px 18px', marginBottom:10, boxShadow:C.shadow, borderLeft:'3px solid ' + (i === 0 ? C.gold : C.border)}}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>
                    <div style={{fontSize:16, fontWeight:800}}>{c.name}</div>
                    <div style={{fontSize:22, fontWeight:900, color:i === 0 ? C.gold : C.charcoal}}>{row.ps.length} <span style={{fontSize:12, fontWeight:600, color:C.muted}}>sessions</span></div>
                  </div>
                  {row.ps.length > 0 &&
                  <div style={{fontSize:11, color:C.muted, fontWeight:600, marginBottom:10, textTransform:'uppercase', letterSpacing:0.8}}>
                    {fmt(period.start || row.ps[0].date)} - {fmt(period.end || row.ps[row.ps.length - 1].date)}
                  </div>}
                  {row.fee > 0 && <div style={{fontSize:13, fontWeight:800, color:C.red, marginBottom:8}}>Charges AED {money(row.fee)}</div>}
                  <div style={{display:'flex', flexWrap:'wrap', gap:6}}>
                    {row.ps.map(function (s) {
                      return <span key={s.id} style={{background:C.surface, borderRadius:9, padding:'5px 10px', fontSize:12, fontWeight:700, color:C.mid, border:'1px solid ' + C.border}}>{fmt(s.date)}</span>;
                    })}
                  </div>
                </div>
              );
            })}
          {orphanFees > 0 &&
          <div style={{background:C.card, borderRadius:20, padding:'16px 18px', marginBottom:10, boxShadow:C.shadow}}>
            <div style={{fontSize:14, fontWeight:800}}>Charges for removed clients</div>
            <div style={{fontSize:13, fontWeight:800, color:C.red, marginTop:6}}>AED {money(orphanFees)}</div>
          </div>}
        </div>}

        {tab === 'charges' &&
        <div>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:14, gap:8}}>
            <div style={{fontSize:11, fontWeight:800, color:C.mid, textTransform:'uppercase', letterSpacing:1.5}}>Charges & Incidents</div>
            <div style={{fontSize:13, fontWeight:800, color:C.charcoal}}>AED {money(PT.chargeTotalFor(charges))}</div>
          </div>
          {charges.length === 0
            ? <div style={{background:C.card, borderRadius:20, padding:'48px 20px', textAlign:'center', boxShadow:C.shadow}}>
              <div style={{fontSize:48, marginBottom:12}}>{'\u2705'}</div>
              <div style={{color:C.muted, fontSize:14}}>No charges logged</div>
            </div>
            : <div>
              {clients.filter(function (c) { return charges.some(function (ch) { return ch.clientId === c.id; }); }).map(function (c) {
                var rows = charges.filter(function (ch) { return ch.clientId === c.id; });
                return (
                  <div key={c.id} style={{background:C.card, borderRadius:20, padding:'16px 18px', marginBottom:12, boxShadow:C.shadow}}>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:12, gap:8}}>
                      <div style={{fontSize:16, fontWeight:800}}>{c.name}</div>
                      <div style={{fontSize:14, fontWeight:800, color:C.red}}>AED {money(PT.chargeTotalFor(charges, c.id))}</div>
                    </div>
                    {rows.map(renderCharge)}
                  </div>
                );
              })}
              {charges.some(function (ch) { return !knownClient(ch.clientId); }) &&
              <div style={{background:C.card, borderRadius:20, padding:'16px 18px', marginBottom:12, boxShadow:C.shadow}}>
                <div style={{fontSize:16, fontWeight:800, marginBottom:12}}>Removed clients</div>
                {charges.filter(function (ch) { return !knownClient(ch.clientId); }).map(renderCharge)}
              </div>}
            </div>
          }
        </div>}
      </div>

      {(tab === 'clients' || tab === 'charges') && (
        <button data-ui="fab" className="pt-fab" onClick={function () { tab === 'clients' ? openAdd('client', {startDate:PT.todayStr()}) : openAdd('charge'); }}

      )}

      <div className="pt-tabs">
        {[['dashboard','\uD83D\uDCCA','Dashboard'], ['clients','\uD83D\uDC64','Clients'], ['report','\uD83C\uDFC6','Report'], ['charges','\uD83E\uDDFE','Charges']].map(function (arr) {
          return (
            <div key={arr[0]} data-ui={'tab-' + arr[0]} onClick={function () { setTab(arr[0]); }} style={{flex:1, textAlign:'center', cursor:'pointer', padding:'4px 0'}}>
              <div style={{fontSize:18, marginBottom:3}}>{arr[1]}</div>
              <div style={{fontSize:10, fontWeight:800, letterSpacing:0.5, color:tab === arr[0] ? C.black : C.muted, textTransform:'uppercase'}}>{arr[2]}</div>
              {tab === arr[0] && <div style={{width:20, height:2.5, borderRadius:99, backgroundImage:C.gradGold, margin:'4px auto 0'}} />}
            </div>
          );
        })}
      </div>

      {showPeriod && periodDraft &&
      <Modal title="Billing Period" onClose={closePeriod}>

        <input data-ui="period-start" style={inp} type="date" value={periodDraft.start || ''} onChange={function (e) { setPeriodDraft(function (p) { return Object.assign({}, p, {start:e.target.value}); }); }} />
        <Lbl>End Date</Lbl>
        <input data-ui="period-end" style={inp} type="date" value={periodDraft.end || ''} onChange={function (e) { setPeriodDraft(function (p) { return Object.assign({}, p, {end:e.target.value}); }); }} />
        <button data-ui="period-save" style={goldBtn} onClick={savePeriodDraft}>Save Period</button>
        <button style={ghostBtn} onClick={resetPeriod}>Reset to Calendar Month</button>
      </Modal>}

      {showImport &&
      <Modal title="Import Sessions" onClose={function () { setShowImport(false); }}>
        <p style={{fontSize:13, color:C.muted, marginBottom:18, lineHeight:1.6}}>Paste the data below. This adds to existing sessions and does not delete any.</p>
        <Lbl>Paste Data</Lbl>
        <textarea style={Object.assign({}, inp, {height:120, resize:'none', fontFamily:'monospace', fontSize:12})} value={importText} onChange={function (e) { setImportText(e.target.value); }} placeholder="Name|2026-06-01,Name|2026-06-02,..." />
        <button style={goldBtn} onClick={importSessions}>Import Sessions</button>
      </Modal>}

      {showCommission && commDraft &&
      <Modal title="Commission Settings" onClose={closeCommission}>
        <p style={{fontSize:13, color:C.muted, marginBottom:18, lineHeight:1.6}}>Closing this without Save keeps your current settings.</p>
        <Lbl>Monthly Quota (AED)</Lbl>
        <input data-ui="commission-quota" style={inp} type="number" value={commDraft.quota} onChange={function (e) { setCommDraft(function (p) { return Object.assign({}, p, {quota:e.target.value}); }); }} />
        <Lbl>Net Revenue Factor (%)</Lbl>
        <input style={inp} type="number" value={commDraft.netFactor} onChange={function (e) { setCommDraft(function (p) { return Object.assign({}, p, {netFactor:e.target.value}); }); }} />
        <div data-ui="commission-charges" onClick={function () { setCommDraft(function (p) { return Object.assign({}, p, {includeCharges:!p.includeCharges}); }); }} style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:12, background:C.surface, borderRadius:14, padding:'14px 16px', marginBottom:12, cursor:'pointer'}}>
          <div>
            <div style={{fontWeight:800, fontSize:14}}>Count charges in commission</div>
            <div style={{fontSize:12, color:C.muted, marginTop:4, lineHeight:1.45}}>Off leaves late-cancel and no-show fees out of your commission. On adds this period&apos;s fees to revenue before the quota. Session count and tier stay the same.</div>
          </div>
          <div style={{fontWeight:900, color:commDraft.includeCharges ? C.green : C.muted, flexShrink:0}}>{commDraft.includeCharges ? 'On' : 'Off'}</div>

        <div style={{background:C.surface, borderRadius:14, padding:'14px', marginBottom:6, fontSize:12, color:C.mid, lineHeight:1.8}}>

        </div>
        <button data-ui="commission-save" style={goldBtn} onClick={saveCommissionDraft}>Save Settings</button>
      </Modal>}

      {showBackup &&
      <Modal title="Backup & Restore" onClose={function () { setShowBackup(false); }}>
        <div style={{background:C.surface, borderRadius:14, padding:'14px', marginBottom:16, fontSize:13, color:C.mid, lineHeight:1.55}}>
          <div style={{fontWeight:800, color:C.txt, marginBottom:6}}>Moving onto your Home Screen?</div>

          <div style={{marginTop:8}}>1. Tap <b>Copy backup</b> here.</div>
          <div>2. Open PT Planner from your Home Screen.</div>
          <div>3. Tap <b>Backup</b>, paste into Restore, tap <b>Check this backup</b>, then <b>Replace all data on this phone</b>.</div>
          <div style={{marginTop:8}}>You can also download the file here and choose it in the Home Screen app.</div>
        </div>
        <button data-ui="backup-copy" style={goldBtn} onClick={onCopyBackup}>Copy backup</button>
        <button data-ui="backup-download" style={ghostBtn} onClick={onDownloadBackup}>Download file</button>
        {canShare && <button style={ghostBtn} onClick={onShareBackup}>Share backup</button>}

        {showBackupText &&
        <textarea data-ui="backup-text" readOnly style={Object.assign({}, inp, {height:120, resize:'none', fontFamily:'monospace', fontSize:11})} value={backupJsonShown} />}
        <div style={{fontSize:12, color:C.muted, fontWeight:700, margin:'4px 0 16px'}}>
          {meta.backupAt ? ('Last backup ' + fmt(PT.localDateStr(meta.backupAt))) : 'No backup from this phone yet.'}

        {backupMsg && <div data-ui="backup-msg" style={{fontSize:13, fontWeight:700, color:C.charcoal, background:'#f7f6f2', borderRadius:12, padding:'12px 14px', marginBottom:12, lineHeight:1.45}}>{backupMsg}</div>}
        <div style={{height:1, background:C.border, margin:'6px 0 16px'}} />
        <div style={{fontSize:16, fontWeight:900, marginBottom:8}}>Restore</div>
        <p style={{fontSize:13, color:C.muted, marginBottom:12, lineHeight:1.5}}>Paste a backup or choose the file. Nothing is replaced until you confirm.</p>
        <Lbl>Paste backup</Lbl>
        <textarea data-ui="restore-text" style={Object.assign({}, inp, {height:100, resize:'none', fontFamily:'monospace', fontSize:16})} value={restoreText} placeholder="Paste the backup text here" onChange={function (e) { setRestoreText(e.target.value); setRestorePreview(null); }} />
        <input data-ui="restore-file" type="file" accept="application/json,.json,text/plain,.txt" style={{display:'none'}} onChange={onRestoreFile} />
        <button style={ghostBtn} onClick={function () { var el = document.querySelector('[data-ui="restore-file"]'); if (el) el.click(); }}>Choose a file</button>
        <button data-ui="restore-check" style={primaryBtn} onClick={checkRestore}>Check this backup</button>
        {previewCounts &&
        <div data-ui="restore-preview" style={{background:'#fff7ed', border:'1px solid #fed7aa', borderRadius:14, padding:'14px', marginTop:12}}>
          <div style={{fontWeight:800, marginBottom:6}}>This will replace everything on this phone.</div>
          <div style={{fontSize:13, color:C.mid, lineHeight:1.5}}>
            Backup: {previewCounts.clients} clients, {previewCounts.sessions} sessions, {previewCounts.charges} charges.
            <br />
            On this phone now: {clients.length} clients, {sessions.length} sessions, {charges.length} charges.
          </div>
          <button data-ui="restore-replace" style={dangerBtn} onClick={applyRestore}>Replace all data on this phone</button>
          <button style={ghostBtn} onClick={function () { setRestorePreview(null); }}>Cancel</button>
        </div>}
      </Modal>}

      {modal === 'client' &&
      <Modal title={editId ? 'Edit Client' : 'New Client'} onClose={closeModal}>
        <p style={{fontSize:13, color:C.muted, marginBottom:14, lineHeight:1.5}}>Saving updates the current package. Renew keeps it in the history and starts a new one.</p>
        {errorLine()}
        <Lbl>Name</Lbl>
        <input style={inp} placeholder="e.g. Jeremy" value={form.name || ''} onChange={function (e) { f({name:e.target.value}); }} />
        <Lbl>Package Sessions</Lbl>
        <input style={inp} type="number" placeholder="e.g. 20" value={form.packageSessions || ''} onChange={function (e) { f({packageSessions:e.target.value}); }} />
        <Lbl>Package Value (AED)</Lbl>
        <input style={inp} type="number" placeholder="e.g. 3500" value={form.packageValue || ''} onChange={function (e) { f({packageValue:e.target.value}); }} />
        <Lbl>Start Date</Lbl>
        <input style={inp} type="date" value={form.startDate || ''} onChange={function (e) { f({startDate:e.target.value}); }} />
        <button style={goldBtn} onClick={saveClient}>Save Client</button>
        {editId && <button style={ghostBtn} onClick={function () { openRenew(clients.filter(function (c) { return c.id === editId; })[0]); }}>Renew package</button>}
        {editId && <button style={ghostBtn} onClick={function () { delClient(editId); }}>Delete Client</button>}
      </Modal>}

      {modal === 'renew' &&
      <Modal title="Renew Package" onClose={closeModal}>
        <p style={{fontSize:13, color:C.muted, marginBottom:14, lineHeight:1.5}}>The current package stays in the history. Sessions on or after the new start date count on the new package.</p>
        {errorLine()}
        <Lbl>Package Sessions</Lbl>
        <input style={inp} type="number" placeholder="e.g. 20" value={form.packageSessions || ''} onChange={function (e) { f({packageSessions:e.target.value}); }} />
        <Lbl>Package Value (AED)</Lbl>
        <input style={inp} type="number" placeholder="e.g. 3500" value={form.packageValue || ''} onChange={function (e) { f({packageValue:e.target.value}); }} />
        <Lbl>Start Date</Lbl>
        <input style={inp} type="date" value={form.startDate || ''} onChange={function (e) { f({startDate:e.target.value}); }} />
        <button style={goldBtn} onClick={saveRenew}>Save new package</button>
      </Modal>}

      {modal === 'package' &&
      <Modal title="Edit Package" onClose={closeModal}>
        {errorLine()}
        <Lbl>Package Sessions</Lbl>
        <input style={inp} type="number" value={form.packageSessions || ''} onChange={function (e) { f({packageSessions:e.target.value}); }} />
        <Lbl>Package Value (AED)</Lbl>
        <input style={inp} type="number" value={form.packageValue || ''} onChange={function (e) { f({packageValue:e.target.value}); }} />
        <Lbl>Start Date</Lbl>
        <input style={inp} type="date" value={form.startDate || ''} onChange={function (e) { f({startDate:e.target.value}); }} />
        <button style={goldBtn} onClick={savePackageEdit}>Save Package</button>
      </Modal>}

      {modal === 'session' &&
      <Modal title={editId ? 'Edit Session' : 'Add Session'} onClose={closeModal}>
        {errorLine()}
        {!form.clientId && form.clientName ? <p style={{fontSize:13, color:C.mid, marginTop:-4, marginBottom:12, lineHeight:1.45}}>Imported as &ldquo;{form.clientName}&rdquo;. Choose which client it belongs to.</p> : null}
        <Lbl>Client</Lbl>
        <select data-ui="session-client" style={inp} value={form.clientId || ''} onChange={function (e) { f({clientId:e.target.value}); }}>
          <option value="">Select client...</option>
          {clients.map(function (c) { return <option key={c.id} value={c.id}>{c.name}</option>; })}
        </select>
        {clients.length === 0 && <p style={{fontSize:13, color:C.mid, marginTop:-4, marginBottom:12}}>Add a client first, then you can log a session.</p>}
        <Lbl>Date</Lbl>
        <input data-ui="session-date" style={inp} type="date" value={form.date || ''} onChange={function (e) { f({date:e.target.value}); }} />
        <button data-ui="session-save" style={goldBtn} onClick={saveSession}>Save Session</button>
        {editId && <button style={dangerBtn} onClick={function () { var s = null, i; for (i = 0; i < sessions.length; i++) if (sessions[i].id === editId) s = sessions[i]; if (s) askDeleteSession(s); }}>Delete Session</button>}
      </Modal>}

      {modal === 'charge' &&
      <Modal title={editId ? 'Edit Charge' : 'Log Charge'} onClose={closeModal}>
        {errorLine()}
        <Lbl>Client</Lbl>
        <select style={inp} value={form.clientId || ''} onChange={function (e) { f({clientId:e.target.value}); }}>
          <option value="">Select client...</option>
          {clients.map(function (c) { return <option key={c.id} value={c.id}>{c.name}</option>; })}
        </select>
        <Lbl>Type</Lbl>
        <select style={inp} value={form.type || 'late_cancel'} onChange={function (e) { f({type:e.target.value}); }}>
          <option value="late_cancel">Late Cancellation</option>
          <option value="no_show">No Show</option>
          <option value="other">Other</option>
        </select>
        <Lbl>Amount (AED)</Lbl>
        <input data-ui="charge-amount" style={inp} type="number" min="0" step="0.01" inputMode="decimal" placeholder="e.g. 150" value={form.amount === 0 || form.amount ? form.amount : ''} onChange={function (e) { f({amount:e.target.value}); }} />
        <Lbl>Date</Lbl>
        <input style={inp} type="date" value={form.date || ''} onChange={function (e) { f({date:e.target.value}); }} />
        <Lbl>Notes (optional)</Lbl>
        <input style={inp} placeholder="e.g. Cancelled 1h before" value={form.notes || ''} onChange={function (e) { f({notes:e.target.value}); }} />
        <button data-ui="save-charge" style={goldBtn} onClick={saveCharge}>Save Charge</button>
      </Modal>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
